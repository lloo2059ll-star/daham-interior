<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>다함인테리어 — 상가 견적서</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#111f3d"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="auth.js"></script><script src="commercial-estimate-domain.js"></script>
<script src="price-management.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172036;font:14px Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:178px minmax(0,1fr)}.sidebar{position:sticky;top:0;height:100vh;background:#0c1d3e;color:#fff;padding:24px 14px}.logo{font-size:25px;font-weight:900;letter-spacing:.08em;margin:0 10px 28px}.nav{display:grid;gap:5px}.nav a{color:#d9e1f1;text-decoration:none;padding:12px;border-radius:9px;font-weight:700}.nav a.active,.nav a:hover{background:#5632d5;color:#fff}.workspace{min-width:0;padding:24px}.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.page-head h1{margin:0 0 5px;font-size:25px}.page-head p{margin:0;color:#7b8498}.top-actions{display:flex;gap:8px}.btn{border:1px solid #d9dfeb;background:#fff;color:#394158;border-radius:8px;padding:10px 14px;font-weight:800;cursor:pointer}.btn.primary{background:#6238df;border-color:#6238df;color:#fff}.commercial-shell{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}.commercial-editor{min-width:0}.project-fields{display:grid;grid-template-columns:2fr 1fr 1fr;gap:1px;background:#dfe4ee;border:1px solid #dfe4ee;border-radius:12px;overflow:hidden;margin-bottom:14px}.field{background:#fff;padding:12px 14px}.field label{display:block;color:#8a93a6;font-size:11px;font-weight:800;margin-bottom:5px}.field input{width:100%;border:0;outline:0;font-weight:800;color:#172036}.commercial-categories{display:grid;gap:7px}.commercial-category{background:#fff;border:1px solid #dfe4ee;border-radius:9px;overflow:hidden}.commercial-category-toggle{width:100%;border:0;background:#fff;padding:12px 14px;display:flex;align-items:center;gap:8px;text-align:left;font-weight:900;cursor:pointer}.commercial-category-toggle .name{flex:1}.calc-badge,.edit-badge{font-size:10px;padding:3px 8px;border-radius:999px}.calc-badge{background:#eef5ff;color:#2563d8}.edit-badge{background:#edfaf1;color:#168449}.chev{font-size:13px;color:#7c8495}.commercial-category-body{border-top:1px solid #e5e9f1}.line-head,.commercial-line{display:grid;grid-template-columns:minmax(180px,1.45fr) 80px 55px 110px 110px 90px;gap:8px;align-items:center}.line-head{padding:8px 12px;background:#f8f9fc;color:#8b93a5;font-size:10px;font-weight:800;text-align:right}.line-head span:first-child{text-align:left}.commercial-line{padding:8px 12px;border-top:1px solid #eef1f6}.commercial-line:first-child{border-top:0}.line-name{font-weight:750}.line-name small{display:block;color:#8c94a6;font-weight:500;margin-top:2px}.num{width:100%;border:1px solid #dce1eb;border-radius:6px;padding:7px;text-align:right;background:#fff}.unit{text-align:center;color:#7c8496}.money{text-align:right;font-variant-numeric:tabular-nums;font-weight:800}.money.labor{color:#2468d5}.money.material{color:#149152}.line-actions{display:flex;justify-content:flex-end;gap:4px}.mini{border:1px solid #dce1eb;background:#fff;border-radius:5px;padding:5px 7px;cursor:pointer;color:#5b6477}.warning{margin:8px 12px;padding:9px 11px;border-radius:7px;background:#fff5df;color:#8a5a00;font-size:12px}.commercial-summary{position:sticky;top:18px;background:#fff;border:1px solid #dfe4ee;border-radius:13px;padding:20px;box-shadow:0 8px 24px rgba(26,39,73,.06)}.commercial-summary h2{font-size:17px;margin:0 0 18px}.legend{display:flex;gap:15px;font-size:11px;color:#7e879a;border-bottom:1px solid #e8ebf2;padding-bottom:14px;margin-bottom:12px}.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px}.sum-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:10px 0}.sum-row strong{font-size:15px}.sum-row input,.sum-row select{border:1px solid #dce1eb;border-radius:6px;padding:6px;width:88px;text-align:right}.sum-total{border-top:1px solid #d9deea;margin-top:10px;padding-top:18px;color:#5a34d5}.sum-total strong{font-size:25px}.summary-actions{display:grid;gap:8px;margin-top:20px}.summary-actions .btn{width:100%}.status{font-size:11px;color:#778196;text-align:center;margin-top:10px}.empty{padding:18px;color:#8a93a6;text-align:center}.customer-view .internal-only{display:none!important}
@media screen and (max-width:1100px){.commercial-shell{grid-template-columns:1fr}.commercial-summary{position:static;grid-row:1}.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0 18px}.summary-actions{grid-template-columns:repeat(3,1fr)}}
@media screen and (max-width:767px){.app{display:block}.sidebar{position:static;width:100%;height:auto;padding:14px}.logo{margin:0}.nav{display:none}.workspace{padding:14px}.page-head{align-items:flex-start;gap:10px}.page-head p{display:none}.top-actions .btn:not(.primary){display:none}.project-fields{grid-template-columns:1fr}.summary-grid{grid-template-columns:1fr 1fr}.summary-actions{grid-template-columns:1fr}.line-head{display:none}.commercial-line{grid-template-columns:1fr 85px 55px;gap:7px}.commercial-line .money{padding-top:5px}.commercial-line .money.labor:before{content:"인건비 ";font-size:10px;color:#7d8698}.commercial-line .money.material:before{content:"자재비 ";font-size:10px;color:#7d8698}.line-actions{grid-column:3}.calc-badge,.edit-badge{display:none}}
@media print{.sidebar,.page-head,.project-fields,.calc-badge,.edit-badge,.summary-actions,.status,.internal-only{display:none!important}.app{display:block}.workspace{padding:0}.commercial-shell{display:block}.commercial-summary{position:static;box-shadow:none;border:0;margin-bottom:15px}.commercial-category{break-inside:avoid}.commercial-category-body[hidden]{display:block}.commercial-line{font-size:10px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="logo">DAHAM</div><nav class="nav"><a href="index.html">대시보드</a><a href="schedule.html">일정관리</a><a href="consult.html">상담/실측</a><a class="active" href="estimate-commercial.html">견적관리</a><a href="contract.html">계약관리</a><a href="order.html">발주관리</a><a href="payment.html">정산/결제</a><a href="price-editor.html">설정</a></nav></aside><main class="workspace"><header class="page-head"><div><h1>상가 견적서 작성</h1><p>공종별 수량과 단가를 입력하면 인건비와 자재비가 자동 계산됩니다</p></div><div class="top-actions"><button class="btn" onclick="showProjectList()">견적 목록</button><button class="btn primary" onclick="newCommercialProject()">+ 새 견적</button></div></header><div id="list-view" hidden></div><div id="editor-view"><div class="commercial-shell"><section id="commercial-project-form" class="commercial-editor"><div class="project-fields"><div class="field"><label for="site-name">현장명</label><input id="site-name" placeholder="예: 강남역 인근 상가"></div><div class="field"><label for="area-pyeong">공사면적</label><input id="area-pyeong" type="number" min="0" step="0.1" placeholder="0평"></div><div class="field"><label for="client-name">고객명</label><input id="client-name" placeholder="고객명"></div></div><div id="commercial-categories" class="commercial-categories"></div></section><aside id="commercial-summary" class="commercial-summary" aria-live="polite"></aside></div></div></main></div>
<script>
const PROJ_DB='daham_commercial_v1',PROJ_INDEX_KEY='daham_commercial_index_v1',_BASE_DOMAIN=window.DAHAM_COMMERCIAL_ESTIMATE,_SETTINGS=JSON.parse(localStorage.getItem('daham_settings_v1')||localStorage.getItem('daham_settings')||'{}'),D={..._BASE_DOMAIN,CATALOG:DAHAM_PRICES.loadCommercialDefaults(_BASE_DOMAIN.CATALOG,_SETTINGS)};const _AUTH_CONFIG=DAHAM_AUTH.getSupabaseConfig();let _sb=null,allProjects=[],saveTimer=null;let commercialDraft={id:'',client:{siteName:'',clientName:''},areaPyeong:0,lines:[],fees:{managementRate:5,profitMode:'rate',profitRate:15,profitAmount:0,vatRate:10},catalogSnapshot:{},updatedAt:''};
const won=n=>'₩ '+Math.round(Number(n)||0).toLocaleString('ko-KR'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function catalogItem(id){for(const c of D.CATALOG){const item=c.items.find(x=>x.id===id);if(item)return{...item,categoryId:c.id}}return null}function draftLine(id){let line=commercialDraft.lines.find(x=>x.id===id);if(!line){const def=catalogItem(id);line={id,categoryId:def.categoryId,quantity:0,overrides:{}};commercialDraft.lines.push(line);commercialDraft.catalogSnapshot[id]=JSON.parse(JSON.stringify(def))}return line}
function renderCommercialCategories(){document.getElementById('commercial-categories').innerHTML=D.CATALOG.map((cat,ci)=>`<section class="commercial-category" data-category-id="${cat.id}"><button class="commercial-category-toggle" type="button" aria-expanded="${ci===6||ci===7}" onclick="toggleCommercialCategory(this)"><span class="chev">${ci===6||ci===7?'⌄':'›'}</span><span class="name">${esc(cat.name)}</span><span class="calc-badge">자동 계산</span><span class="edit-badge">직접 수정 가능</span></button><div class="commercial-category-body" ${ci===6||ci===7?'':'hidden'}>${renderCommercialLines(cat)}</div></section>`).join('')}
function renderCommercialLines(cat){return`<div class="line-head"><span>항목</span><span>수량</span><span>단위</span><span>인건비</span><span>자재비</span><span>수정</span></div>`+cat.items.map(renderCommercialLine).join('')}function renderCommercialLine(item){const line=draftLine(item.id),r=D.calculateLine({...item,...line});return`<div class="commercial-line" data-line-id="${item.id}"><div class="line-name">${esc(item.name)}${item.warning?`<small>${esc(item.warning)}</small>`:''}</div><input class="num" aria-label="${esc(item.name)} 수량" type="number" min="0" step="0.1" value="${line.quantity||''}" onchange="setCommercialQuantity('${item.id}',this.value)"><div class="unit">${esc(item.unit)}</div><div class="money labor">${won(r.labor)}</div><div class="money material">${won(r.material)}</div><div class="line-actions"><button class="mini internal-only" onclick="editCommercialRate('${item.id}')">수정</button><button class="mini internal-only" onclick="restoreCommercialAutomaticValue('${item.id}')">↺</button></div></div>${item.calc==='warning'?`<div class="warning">${esc(item.warning)}</div>`:''}`}
function toggleCommercialCategory(btn){const body=btn.nextElementSibling,open=body.hidden;body.hidden=!open;btn.setAttribute('aria-expanded',String(open));btn.querySelector('.chev').textContent=open?'⌄':'›'}function setCommercialQuantity(id,value){draftLine(id).quantity=Math.max(0,Number(value)||0);refreshCommercialLine(id);recalculateCommercialEstimate();scheduleCommercialSave()}function setCommercialOverride(id,field,value){const line=draftLine(id);line.overrides={...(line.overrides||{}),[field]:Math.max(0,Number(value)||0)};refreshCommercialLine(id);recalculateCommercialEstimate();scheduleCommercialSave()}function restoreCommercialAutomaticValue(id,field){const line=draftLine(id);if(field)delete line.overrides[field];else line.overrides={};refreshCommercialLine(id);recalculateCommercialEstimate();scheduleCommercialSave()}function editCommercialRate(id){const line=draftLine(id),def=catalogItem(id),l=prompt('인건비 단가',line.overrides.laborUnit??def.laborUnit??0);if(l===null)return;const m=prompt('자재비 단가',line.overrides.materialUnit??def.materialUnit??0);if(m===null)return;line.overrides={laborUnit:Math.max(0,Number(l)||0),materialUnit:Math.max(0,Number(m)||0)};refreshCommercialLine(id);recalculateCommercialEstimate();scheduleCommercialSave()}function refreshCommercialLine(id){const el=document.querySelector(`[data-line-id="${id}"]`);if(el)el.outerHTML=renderCommercialLine(catalogItem(id))}
function selectedResults(){return commercialDraft.lines.filter(x=>Number(x.quantity)>0).map(x=>D.calculateLine({...commercialDraft.catalogSnapshot[x.id],...x}))}function recalculateCommercialEstimate(){const estimate=D.calculateEstimate({lines:selectedResults()}),totals=D.calculateCommercialTotals(estimate.totals,commercialDraft.fees);renderCommercialSummary(totals);return{estimate,totals}}
function renderCommercialSummary(t){const f=commercialDraft.fees;document.getElementById('commercial-summary').innerHTML=`<h2>실시간 견적 요약</h2><div class="legend"><span><i class="dot" style="background:#2468d5"></i>인건비</span><span><i class="dot" style="background:#149152"></i>자재비</span></div><div class="summary-grid"><div class="sum-row"><span>인건비</span><strong style="color:#2468d5">${won(t.labor)}</strong></div><div class="sum-row"><span>자재비</span><strong style="color:#149152">${won(t.material)}</strong></div><div class="sum-row"><span>현장경비</span><strong>${won(t.expense)}</strong></div><div class="sum-row internal-only"><span>일반관리비 (%)</span><input type="number" min="0" value="${f.managementRate}" onchange="setFee('managementRate',this.value)"></div><div class="sum-row internal-only"><span>이윤 방식</span><select onchange="setFee('profitMode',this.value)"><option value="rate" ${f.profitMode==='rate'?'selected':''}>퍼센트</option><option value="fixed" ${f.profitMode==='fixed'?'selected':''}>고정금액</option></select></div><div class="sum-row internal-only"><span>이윤 ${f.profitMode==='rate'?'(%)':'(원)'}</span><input type="number" min="0" value="${f.profitMode==='rate'?f.profitRate:f.profitAmount}" onchange="setFee('${f.profitMode==='rate'?'profitRate':'profitAmount'}',this.value)"></div><div class="sum-row"><span>부가세</span><strong>${won(t.vat)}</strong></div></div><div class="sum-row sum-total"><span>최종 견적금액</span><strong>${won(t.grandTotal)}</strong></div><div class="summary-actions"><button class="btn" onclick="manualCommercialSave()">임시저장</button><button class="btn" onclick="previewCommercialEstimate()">견적서 미리보기</button><button class="btn primary" onclick="manualCommercialSave(true)">저장</button></div><div id="save-status" class="status">자동 저장됨</div>`}function setFee(field,value){commercialDraft.fees[field]=field==='profitMode'?value:Math.max(0,Number(value)||0);recalculateCommercialEstimate();scheduleCommercialSave()}
function collectCommercialState(){commercialDraft.client.siteName=document.getElementById('site-name').value.trim();commercialDraft.client.clientName=document.getElementById('client-name').value.trim();commercialDraft.areaPyeong=Number(document.getElementById('area-pyeong').value)||0;return JSON.parse(JSON.stringify(commercialDraft))}function applyCommercialState(state){commercialDraft={...commercialDraft,...JSON.parse(JSON.stringify(state)),client:{...commercialDraft.client,...(state.client||{})},fees:{...commercialDraft.fees,...(state.fees||{})},catalogSnapshot:state.catalogSnapshot||{}};document.getElementById('site-name').value=commercialDraft.client.siteName||'';document.getElementById('client-name').value=commercialDraft.client.clientName||'';document.getElementById('area-pyeong').value=commercialDraft.areaPyeong||'';renderCommercialCategories();recalculateCommercialEstimate()}function loadDB(){try{allProjects=JSON.parse(localStorage.getItem(PROJ_DB)||'[]')}catch(e){allProjects=[]}}function saveDB(){localStorage.setItem(PROJ_DB,JSON.stringify(allProjects));localStorage.setItem(PROJ_INDEX_KEY,JSON.stringify(allProjects.map(p=>({id:p.id,updatedAt:p.updatedAt}))))}function initCommercialCloud(){try{const token=DAHAM_AUTH.getAccessToken();_sb=window.supabase.createClient(_AUTH_CONFIG.url,_AUTH_CONFIG.key,{global:{headers:token?{Authorization:'Bearer '+token}:{}},auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}})}catch(e){_sb=null}}function cloudPushCommercial(project){if(!_sb||!project)return Promise.resolve();const index=allProjects.map(p=>({id:p.id,updatedAt:p.updatedAt}));return Promise.all([_sb.from('sync_data').upsert({key:PROJ_DB+'__'+project.id,value:JSON.stringify(project),updated_at:project.updatedAt}),_sb.from('sync_data').upsert({key:PROJ_INDEX_KEY,value:JSON.stringify(index),updated_at:project.updatedAt})])}function cloudPullCommercial(){if(!_sb)return Promise.resolve();return _sb.from('sync_data').select('value').eq('key',PROJ_INDEX_KEY).maybeSingle().then(async r=>{if(r.error||!r.data)return;let index=[];try{index=JSON.parse(r.data.value||'[]')}catch(e){return}const rows=await Promise.all(index.map(p=>_sb.from('sync_data').select('value').eq('key',PROJ_DB+'__'+p.id).maybeSingle()));const remote=rows.filter(x=>x.data).map(x=>{try{return JSON.parse(x.data.value)}catch(e){return null}}).filter(Boolean);const merged=new Map(allProjects.map(p=>[p.id,p]));for(const p of remote){const local=merged.get(p.id);if(!local||String(p.updatedAt)>String(local.updatedAt))merged.set(p.id,p)}allProjects=[...merged.values()].sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt)));saveDB()})}function scheduleCommercialSave(){clearTimeout(saveTimer);const s=document.getElementById('save-status');if(s)s.textContent='저장 중…';saveTimer=setTimeout(()=>manualCommercialSave(false,true),500)}function manualCommercialSave(finalSave=false,silent=false){const state=collectCommercialState(),errors=D.validateEstimate(state);if(errors.length){alert(errors[0].message);return}if(!state.id)state.id='cmp_'+Date.now().toString(36);state.updatedAt=new Date().toISOString();commercialDraft=state;const i=allProjects.findIndex(p=>p.id===state.id);if(i>=0)allProjects[i]=state;else allProjects.unshift(state);saveDB();cloudPushCommercial(state).catch(()=>{});const s=document.getElementById('save-status');if(s)s.textContent='저장됨';if(finalSave&&!silent)alert('상가 견적서를 저장했습니다.')}function newCommercialProject(){applyCommercialState({id:'',client:{siteName:'',clientName:''},areaPyeong:0,lines:[],fees:{managementRate:5,profitMode:'rate',profitRate:15,profitAmount:0,vatRate:10},catalogSnapshot:{},updatedAt:''})}
function showProjectList(){const list=document.getElementById('list-view'),editor=document.getElementById('editor-view');list.hidden=false;editor.hidden=true;list.innerHTML=`<div style="display:flex;justify-content:space-between"><h2>상가 견적 목록</h2><button class="btn primary" onclick="newCommercialProject();listView(false)">+ 새 견적</button></div>`+(allProjects.length?allProjects.map(p=>`<button class="btn" style="display:block;width:100%;text-align:left;margin:7px 0" onclick="openCommercialProject('${p.id}')"><strong>${esc(p.client?.siteName||'현장명 미입력')}</strong><br><small>${esc(p.client?.clientName||'고객명 미입력')} · ${p.areaPyeong||0}평</small></button>`).join(''):'<div class="empty">저장된 상가 견적서가 없습니다.</div>')}function listView(on){document.getElementById('list-view').hidden=!on;document.getElementById('editor-view').hidden=on}function openCommercialProject(id){const p=allProjects.find(x=>x.id===id);if(p){listView(false);applyCommercialState(p)}}
function buildCommercialPrintData(){const{estimate,totals}=recalculateCommercialEstimate(),customerCategoryTotals={},base=totals.subtotal||1;for(const[id,c]of Object.entries(estimate.categories)){const cost=c.labor+c.material+c.expense;customerCategoryTotals[id]=Math.round((cost+(totals.management+totals.profit)*cost/base)/100)*100}return{estimateType:'commercial',client:commercialDraft.client,areaPyeong:commercialDraft.areaPyeong,customerCategoryTotals,vat:totals.vat,grandTotal:totals.grandTotal,selectedLines:commercialDraft.lines.filter(x=>Number(x.quantity)>0).map(x=>({id:x.id,name:catalogItem(x.id)?.name,quantity:x.quantity,unit:catalogItem(x.id)?.unit}))}}function previewCommercialEstimate(){collectCommercialState();localStorage.setItem('daham_estimate_print',JSON.stringify(buildCommercialPrintData()));window.open('estimate-summary.html','_blank')}
function previewCommercialEstimate(){collectCommercialState();localStorage.setItem('daham_estimate_print',JSON.stringify(buildCommercialPrintData()));window.open('estimate-commercial-print.html','_blank')}
const commercialSettingsLink=document.querySelector('a[href="price-editor.html"]');if(commercialSettingsLink)commercialSettingsLink.href='price-commercial.html';
['site-name','client-name','area-pyeong'].forEach(id=>document.getElementById(id).addEventListener('input',scheduleCommercialSave));loadDB();initCommercialCloud();cloudPullCommercial().catch(()=>{});renderCommercialCategories();recalculateCommercialEstimate();
</script></body></html>
