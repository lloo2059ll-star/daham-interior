<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAHAM — 공사 안내문</title>
<script src="auth.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --orange:#E65100;--orange-dk:#BF360C;--orange-lt:#FFF3EE;
  --ink:#1a1a1a;--mid:#555;--dim:#aaa;--line:#e0e0e0;--line-lt:#f5f5f5;
  --bg:#f2f2f2;--white:#fff;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:13px}

/* ── TOOLBAR ── */
.toolbar{
  position:sticky;top:0;z-index:100;height:48px;padding:0 24px;
  display:flex;align-items:center;justify-content:space-between;
  background:#fff;border-bottom:2px solid var(--orange);
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}
.brand{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.14em;color:var(--orange)}
.tb-actions{display:flex;gap:6px}
.tb-btn{
  font-family:var(--sans);font-size:11px;font-weight:500;padding:6px 14px;cursor:pointer;
  border:1.5px solid var(--line);background:#fff;color:var(--mid);transition:all .15s;
}
.tb-btn:hover{border-color:var(--ink);color:var(--ink)}
.tb-btn.primary{border-color:var(--orange);background:var(--orange);color:#fff}
.tb-btn.primary:hover{background:var(--orange-dk);border-color:var(--orange-dk)}
a.tb-btn{text-decoration:none}

/* ── EDITOR ── */
.editor{max-width:780px;margin:32px auto 80px;padding:0 20px}
.editor-title{font-size:18px;font-weight:700;margin-bottom:4px}
.editor-sub{font-size:11px;color:var(--dim);margin-bottom:28px}

/* ── FORM SECTIONS ── */
.form-sec{background:#fff;border:1px solid var(--line);margin-bottom:14px}
.form-sec-hd{
  padding:11px 16px;border-bottom:1px solid var(--line);
  font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.form-row{display:flex;flex-direction:column;padding:12px 16px;border-bottom:1px solid var(--line-lt)}
.form-row:last-child{border-bottom:none}
.form-row.wide{grid-column:span 2}
.form-row label{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--dim);margin-bottom:5px}
.form-row input,.form-row textarea,.form-row select{
  font-family:var(--sans);font-size:13px;color:var(--ink);
  border:none;border-bottom:1px solid var(--line);
  outline:none;padding:4px 0;background:transparent;width:100%;
  transition:border-color .15s;
}
.form-row input:focus,.form-row textarea:focus{border-color:var(--orange)}
.form-row textarea{resize:vertical;min-height:72px;line-height:1.7}

/* ── WORK TYPES ── */
.work-grid{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px}
.work-chip{
  display:flex;align-items:center;gap:6px;padding:6px 12px;
  border:1.5px solid var(--line);cursor:pointer;transition:all .15s;
  font-size:12px;font-weight:600;color:var(--mid);user-select:none;
}
.work-chip input{display:none}
.work-chip.checked{border-color:var(--orange);color:var(--orange);background:var(--orange-lt)}
.work-chip .chip-check{font-size:10px;opacity:0}
.work-chip.checked .chip-check{opacity:1}

/* ── PREVIEW ── */
.preview-wrap{max-width:780px;margin:0 auto 80px;padding:0 20px;display:none}

/* ── DOCUMENT ── */
.doc{
  background:#fff;border:1px solid var(--line);
  padding:52px 56px;font-size:12px;line-height:1.8;
  box-shadow:0 4px 24px rgba(0,0,0,.07);
}
.doc-header{
  border-bottom:3px solid var(--orange);padding-bottom:20px;margin-bottom:28px;
  display:flex;flex-direction:column;gap:12px;
}
.doc-brand{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:.14em;color:var(--orange)}
.doc-brand-sub{font-size:13px;color:var(--mid);letter-spacing:.06em;margin-top:3px}
.doc-title-block{text-align:center}
.doc-title{font-family:'Bebas Neue',sans-serif;font-size:52px;font-weight:400;letter-spacing:.12em;color:var(--orange);-webkit-text-stroke:1.5px var(--orange);paint-order:stroke fill}
.doc-title-sub{font-size:12px;color:var(--mid);letter-spacing:.1em;margin-top:4px}

.doc-greeting{
  background:var(--orange-lt);border-left:4px solid var(--orange);
  padding:16px 20px;margin-bottom:28px;font-size:15px;line-height:2;
}
.doc-greeting strong{color:var(--orange-dk)}

.info-table{width:100%;border-collapse:collapse;margin-bottom:28px}
.info-table th{
  width:28%;padding:11px 16px;background:#6B7280;color:#fff;
  font-size:13px;font-weight:700;letter-spacing:.04em;text-align:left;
  border:1px solid #6B7280;
}
.info-table td{
  padding:11px 16px;border:1px solid var(--line);
  font-size:14px;font-weight:600;
}
.info-table tr:nth-child(odd) td{background:#fafafa}

.work-section{margin-bottom:28px}
.work-section-title{
  font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line);
}
.work-tags{display:flex;flex-wrap:wrap;gap:8px}
.work-tag{
  padding:6px 14px;background:var(--orange);color:#fff;
  font-size:13px;font-weight:700;letter-spacing:.04em;
}

.notice-section{margin-bottom:28px}
.notice-title{
  font-size:15px;font-weight:700;color:var(--ink);margin-bottom:10px;
  padding-left:12px;border-left:3px solid var(--orange);
}
.notice-list{list-style:none;padding:0}
.notice-list li{
  padding:8px 0 8px 18px;position:relative;font-size:14px;line-height:1.7;
  border-bottom:1px solid var(--line-lt);
}
.notice-list li::before{content:'·';position:absolute;left:5px;color:var(--orange);font-weight:700}
.notice-list li:last-child{border-bottom:none}

.custom-notice{
  background:#fafafa;border:1px solid var(--line);padding:16px 18px;
  font-size:14px;line-height:2;white-space:pre-wrap;margin-bottom:28px;
}
.noise-block{
  border:2px solid #E53935;background:#FFF8F8;padding:14px 18px;
  margin-bottom:28px;
}
.noise-block-title{
  font-size:14px;font-weight:800;color:#C62828;letter-spacing:.06em;
  margin-bottom:8px;display:flex;align-items:center;gap:6px;
}
.noise-block-body{font-size:14px;line-height:2;white-space:pre-wrap;color:var(--ink)}

.closing{
  text-align:center;padding:20px;border-top:1px solid var(--line);
  margin-top:8px;
}
.closing-msg{font-size:16px;font-weight:600;margin-bottom:6px}
.closing-sub{font-size:14px;color:var(--mid)}

.doc-footer{
  margin-top:24px;display:flex;justify-content:space-between;align-items:flex-end;
}
.qr-group{display:flex;gap:36px;align-items:flex-end}
.qr-item{display:flex;flex-direction:column;align-items:center;gap:8px}
.qr-item img{width:110px;height:110px;object-fit:contain}
.qr-lbl{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mid)}
.sig-block{text-align:right;line-height:2}
.sig-company{font-size:16px;font-weight:800}
.sig-detail{font-size:13px;color:var(--mid)}
.sig-stamp{
  display:inline-block;margin-top:10px;padding:8px 20px;
  border:2px solid var(--orange);color:var(--orange);
  font-size:14px;font-weight:700;letter-spacing:.08em;
}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:8px 20px;font-size:11px;
  opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;
}
.toast.show{opacity:1}

/* ── PRINT ── */
@media print{
  @page{size:A4 portrait;margin:8mm 10mm}
  .toolbar,.editor,.tb-actions,.toast,.preview-topbar{display:none!important}
  .preview-wrap{display:block!important;max-width:100%;margin:0;padding:0}
  body{background:#fff;font-size:11px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .doc{border:none;box-shadow:none;padding:0}
  .doc-header,.doc-greeting,.info-table th,.work-tag,.noise-block,
  .notice-title,.sig-stamp,.doc-brand,.doc-title{
    -webkit-print-color-adjust:exact;print-color-adjust:exact
  }

  .doc-header{padding-bottom:8px;margin-bottom:10px}
  .doc-brand{font-size:20px}
  .doc-brand-sub{font-size:10px}
  .doc-title{font-size:40px}
  .doc-title-sub{font-size:10px;margin-top:2px}

  .doc-greeting{padding:8px 12px;margin-bottom:10px;font-size:11px;line-height:1.6}

  .info-table th,.info-table td{padding:5px 10px;font-size:11px}
  .info-table{margin-bottom:10px}

  .work-section{margin-bottom:10px}
  .work-section-title{margin-bottom:4px;padding-bottom:4px;font-size:10px}
  .work-tag{padding:3px 8px;font-size:11px}
  .work-tags{gap:5px}

  .noise-block{padding:8px 12px;margin-bottom:10px}
  .noise-block-title{font-size:11px;margin-bottom:4px}
  .noise-block-body{font-size:11px;line-height:1.6}

  .notice-section{margin-bottom:10px}
  .notice-title{font-size:12px;margin-bottom:4px}
  .notice-list li{padding:2px 0 2px 14px;font-size:11px;line-height:1.5}

  .custom-notice{padding:8px 12px;margin-bottom:10px;font-size:11px;line-height:1.6}

  .closing{padding:6px}
  .closing-msg{font-size:12px}
  .closing-sub{font-size:11px}

  .doc-footer{margin-top:10px}
  .sig-company{font-size:12px}
  .sig-detail{font-size:10px}
  .sig-stamp{font-size:11px;padding:5px 12px;margin-top:6px}
  .qr-item img{width:72px;height:72px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .qr-group{gap:18px}
  .qr-lbl{font-size:10px}
}
</style>
<link rel="stylesheet" href="v2-theme.css">
<link rel="stylesheet" href="v2-suite.css">
<script defer src="v2-suite.js"></script>
</head>
<body>

<div class="toolbar">
  <div style="display:flex;align-items:center;gap:12px">
    <a href="index.html" class="tb-btn">← 홈</a>
    <span class="brand">DAHAM</span>
  </div>
  <div class="tb-actions">
    <button class="tb-btn" onclick="showPreview()">미리보기</button>
    <button class="tb-btn primary" onclick="printDoc()">인쇄 / PDF</button>
  </div>
</div>

<!-- EDITOR -->
<div class="editor" id="editor">
  <div class="editor-title">공사 안내문</div>
  <div class="editor-sub">입력 후 인쇄하여 현관문 또는 엘리베이터에 부착하세요.</div>

  <!-- 일정표 연동 -->
  <div class="form-sec" style="border-left:3px solid var(--orange)">
    <div class="form-sec-hd">일정표에서 불러오기</div>
    <div class="form-row wide" style="border:none;flex-direction:row;align-items:center;gap:12px">
      <select id="sched-sel" onchange="loadFromSchedule()"
        style="font-family:var(--sans);font-size:13px;border:1.5px solid var(--line);
               padding:7px 10px;background:#fff;color:var(--ink);flex:1;outline:none;cursor:pointer">
        <option value="">-- 직접 입력 --</option>
      </select>
      <span style="font-size:11px;color:var(--dim)">현장 선택 시 주소·기간·공종·소음일이 자동 입력됩니다</span>
    </div>
  </div>

  <!-- 현장 정보 -->
  <div class="form-sec">
    <div class="form-sec-hd">현장 정보</div>
    <div class="form-grid">
      <div class="form-row wide">
        <label>공사 현장 주소</label>
        <input type="text" id="f-addr" placeholder="예) 경북 구미시 신시로 10길 75-2, 101동 1002호">
      </div>
      <div class="form-row">
        <label>착공일</label>
        <input type="date" id="f-start">
      </div>
      <div class="form-row">
        <label>준공 예정일</label>
        <input type="date" id="f-end">
      </div>
      <div class="form-row">
        <label>공사 시간</label>
        <input type="text" id="f-hours" value="오전 9:00 ~ 오후 5:00" readonly style="color:var(--dim);cursor:default">
      </div>
      <div class="form-row">
        <label>작업 제외일</label>
        <input type="text" id="f-off" placeholder="예) 일요일 · 공휴일">
      </div>
      <div class="form-row wide">
        <label>소음 심한 날 / 작업 내용</label>
        <textarea id="f-noise" placeholder="예) 5월 2일(목) — 철거 작업으로 소음이 심할 예정입니다.&#10;5월 7일(화) — 바닥 타일 철거 작업"></textarea>
      </div>
    </div>
  </div>

  <!-- 공사 내용 -->
  <div class="form-sec">
    <div class="form-sec-hd">공사 내용 (해당 항목 선택)</div>
    <div class="work-grid" id="work-grid">
      <!-- chips rendered by JS -->
    </div>
  </div>

  <!-- 연락처 -->
  <div class="form-sec">
    <div class="form-sec-hd">담당자 정보</div>
    <div class="form-grid">
      <div class="form-row">
        <label>담당자명</label>
        <input type="text" id="f-mgr" placeholder="최일성" value="최일성">
      </div>
      <div class="form-row">
        <label>연락처</label>
        <input type="text" id="f-tel" placeholder="010-2059-0347" value="010-2059-0347">
      </div>
    </div>
  </div>

  <!-- 추가 안내 -->
  <div class="form-sec">
    <div class="form-sec-hd">추가 안내 메시지 (선택)</div>
    <div class="form-row wide" style="border:none">
      <label>직접 입력 (인쇄 시 기본 주의사항 아래 추가됩니다)</label>
      <textarea id="f-extra" placeholder="추가로 안내할 내용을 입력하세요."></textarea>
    </div>
  </div>
</div>

<!-- PREVIEW -->
<div class="preview-wrap" id="preview-wrap">
  <div class="preview-topbar" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <div style="font-size:12px;color:var(--mid)">미리보기 — 실제 인쇄 결과와 유사합니다</div>
    <button class="tb-btn" onclick="showEditor()">← 편집으로</button>
  </div>
  <div class="doc" id="doc"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const WORK_TYPES = [
  '철거','도배','바닥','전기/조명','싱크대','욕실','타일',
  '도장','목공','창호','에어컨','가구','조적','방수','기타'
];

/* 일정 공종 → 안내문 공종 매핑 */
var TASK_TO_WORK = {
  '철거':'철거','마루철거':'철거',
  '도배':'도배',
  '바닥재':'바닥','마루':'바닥','마루시공':'바닥','장판':'바닥',
  '전기':'전기/조명','조명':'전기/조명',
  '에어컨 타공':'에어컨','에어컨 마감':'에어컨',
  '주방·붙박이장':'싱크대',
  '위생도기':'욕실','욕실천장':'욕실',
  '타일':'타일','도장':'도장',
  '목공':'목공','필름·유리':'목공','중문':'목공',
  '창호':'창호','시스템에어컨':'에어컨'
};
var NOISY_TASKS = ['철거','마루철거','목공','타일','마루시공','마루','에어컨타공','에어컨 타공'];
var DOW_KO = ['일','월','화','수','목','금','토'];

var selected = new Set();

function buildWorkGrid(){
  var g = document.getElementById('work-grid');
  g.innerHTML = WORK_TYPES.map(function(w){
    return '<label class="work-chip" id="chip_'+w+'">'
      +'<input type="checkbox" value="'+w+'" onchange="toggleWork(\''+w+'\')">'
      +'<span class="chip-check">✓</span>'+w
      +'</label>';
  }).join('');
}

function toggleWork(w){
  var chip = document.getElementById('chip_'+w);
  if(selected.has(w)){ selected.delete(w); chip.classList.remove('checked'); }
  else { selected.add(w); chip.classList.add('checked'); }
}

function gv(id){ var el=document.getElementById(id); return el?el.value.trim():''; }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function fmtDate(d){
  if(!d) return '';
  var p=d.split('-');
  return p[0]+'년 '+parseInt(p[1])+'월 '+parseInt(p[2])+'일';
}

function buildDoc(){
  var addr   = gv('f-addr')  || '공사 현장 주소';
  var start  = gv('f-start');
  var end    = gv('f-end');
  var hours  = '오전 9:00 ~ 오후 5:00';
  var off    = gv('f-off');
  var noise  = gv('f-noise');
  var mgr    = gv('f-mgr')   || '최일성';
  var tel    = gv('f-tel')   || '010-2059-0347';
  var extra  = gv('f-extra');
  var works  = Array.from(selected);

  var period = start&&end ? fmtDate(start)+' ~ '+fmtDate(end)
             : start ? fmtDate(start)+' ~ 준공일 미정'
             : end   ? '착공일 미정 ~ '+fmtDate(end)
             : '미정';

  var workTags = works.length
    ? works.map(function(w){ return '<span class="work-tag">'+esc(w)+'</span>'; }).join('')
    : '<span style="color:var(--dim);font-size:12px">선택된 공종 없음</span>';

  var noiseBlock = noise
    ? '<div class="noise-block">'
      +'<div class="noise-block-title">⚠ 소음 심한 날 예고</div>'
      +'<div class="noise-block-body">'+esc(noise)+'</div>'
      +'</div>'
    : '';

  var extraBlock = extra
    ? '<div class="custom-notice">'+esc(extra)+'</div>'
    : '';

  var offRow = off
    ? '<tr><th>작업 제외일</th><td>'+esc(off)+'</td></tr>'
    : '';

  document.getElementById('doc').innerHTML = `
    <div class="doc-header">
      <div>
        <div class="doc-brand">DAHAM<span style="color:var(--orange-dk);opacity:.5">·</span>INTERIOR</div>
        <div class="doc-brand-sub">다함인테리어 &nbsp;·&nbsp; 대표 최일성 &nbsp;·&nbsp; 010-2059-0347</div>
      </div>
      <div class="doc-title-block">
        <div class="doc-title">공사 안내문</div>
        <div class="doc-title-sub">CONSTRUCTION NOTICE</div>
      </div>
    </div>

    <div class="doc-greeting">
      안녕하세요, <strong>다함인테리어</strong>입니다.<br>
      아래 세대에서 인테리어 공사가 진행될 예정입니다.<br>
      공사 기간 중 소음 및 분진으로 인해 불편을 드릴 수 있으며,
      최대한 빠르고 조용하게 마무리될 수 있도록 최선을 다하겠습니다.<br>
      <strong>입주자 여러분의 넓은 양해를 부탁드립니다.</strong>
    </div>

    <table class="info-table">
      <tr><th>공사 현장</th><td>${esc(addr)}</td></tr>
      <tr><th>공사 기간</th><td>${esc(period)}</td></tr>
      <tr><th>작업 시간</th><td>${esc(hours)}</td></tr>
      ${offRow}
      <tr><th>시공업체</th><td>다함인테리어</td></tr>
      <tr><th>담당자</th><td>${esc(mgr)} &nbsp; ${esc(tel)}</td></tr>
    </table>

    ${noiseBlock}

    <div class="work-section">
      <div class="work-section-title">공사 내용</div>
      <div class="work-tags">${workTags}</div>

function showPreview(){
  buildDoc();
  document.getElementById('editor').style.display='none';
  document.getElementById('preview-wrap').style.display='block';
  window.scrollTo(0,0);
}

function showEditor(){
  document.getElementById('editor').style.display='block';
  document.getElementById('preview-wrap').style.display='none';
}

function printDoc(){
  buildDoc();
  document.getElementById('editor').style.display='none';
  document.getElementById('preview-wrap').style.display='block';
  setTimeout(function(){ window.print(); },120);
}

function toast(m){
  var t=document.getElementById('toast'); t.textContent=m;
  t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},2000);
}

/* ── 일정표 연동 ── */
function loadScheduleProjects(){
  var sel=document.getElementById('sched-sel');
  if(!sel) return;
  var projects=[];
  try{ projects=JSON.parse(localStorage.getItem('daham_schedule_v1')||'[]'); }catch(e){}
  sel.innerHTML='<option value="">-- 직접 입력 --</option>';
  projects.forEach(function(p){
    var name=(p.info&&(p.info.name||p.info.addr))||'현장명 미입력';
    sel.innerHTML+='<option value="'+p.id+'">'+esc(name)+'</option>';
  });
}

function fmtDateKo(ds){
  if(!ds) return '';
  var d=new Date(ds+'T00:00:00');
  return (d.getMonth()+1)+'월 '+d.getDate()+'일('+DOW_KO[d.getDay()]+')';
}
function fmtDateSimple(ds){
  if(!ds) return '';
  var d=new Date(ds+'T00:00:00');
  return (d.getMonth()+1)+'월 '+d.getDate()+'일';
}

function loadFromSchedule(){
  var id=document.getElementById('sched-sel').value;
  if(!id) return;
  var projects=[];
  try{ projects=JSON.parse(localStorage.getItem('daham_schedule_v1')||'[]'); }catch(e){}
  var p=null;
  for(var i=0;i<projects.length;i++){ if(projects[i].id===id){ p=projects[i]; break; } }
  if(!p) return;

  /* 기본 정보 */
  var info = p.info||{};
  document.getElementById('f-addr').value  = info.addr||info.name||'';
  document.getElementById('f-start').value = info.start||'';
  document.getElementById('f-end').value   = info.end||'';

  /* 공종 자동 선택 */
  selected.clear();
  document.querySelectorAll('.work-chip').forEach(function(c){ c.classList.remove('checked'); });
  (p.tasks||[]).forEach(function(t){
    var w=null;
    Object.keys(TASK_TO_WORK).forEach(function(k){
      if(!w&&t.name.indexOf(k)>=0) w=TASK_TO_WORK[k];
    });
    if(w&&WORK_TYPES.indexOf(w)>=0&&!selected.has(w)){
      selected.add(w);
      var chip=document.getElementById('chip_'+w);
      if(chip) chip.classList.add('checked');
    }
  });

  /* 소음 심한 날 자동 생성 (날짜순 정렬) */
  var noisyList=[];
  (p.tasks||[]).forEach(function(t){
    var matched=NOISY_TASKS.some(function(n){ return t.name.indexOf(n)>=0; });
    if(!matched) return;
    noisyList.push(t);
  });
  noisyList.sort(function(a,b){ return (a.start||'')>(b.start||'')?1:-1; });
  var lines=noisyList.map(function(t){
    var e=(t.end&&t.end!==t.start)?' ~ '+fmtDateSimple(t.end):'';
    var taskName=t.name.replace(/\s*\([^)]*\)/g,'').trim();
    return taskName+' '+fmtDateSimple(t.start)+e;
  });
  document.getElementById('f-noise').value=lines.join('\n');

  toast('✓ 일정표에서 불러왔습니다');
}

buildWorkGrid();
loadScheduleProjects();
</script>
