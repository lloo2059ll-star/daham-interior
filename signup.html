<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAHAM — 계정 만들기</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Pretendard,Arial,sans-serif;background:#f4f5f7;color:#171717;min-height:100vh;display:grid;place-items:center}.box{width:min(430px,calc(100% - 32px));background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:34px;box-shadow:0 20px 60px #00000012}.brand{font-weight:900;font-size:24px;letter-spacing:-1px}.brand small{display:block;font-size:10px;letter-spacing:2px;margin-top:2px;color:#777}.title{font-size:26px;font-weight:800;margin:30px 0 7px}.sub{color:#777;font-size:14px;line-height:1.6;margin-bottom:25px}.field{margin:15px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input{width:100%;height:48px;border:1px solid #d8dbe0;border-radius:11px;padding:0 14px;font-size:15px;outline:none}.field input:focus{border-color:#111}.btn{width:100%;height:50px;border:0;border-radius:11px;background:#071f45;color:#fff;font-weight:800;font-size:15px;margin-top:10px;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.msg{min-height:20px;margin-top:12px;font-size:13px;color:#c62828;line-height:1.5}.msg.ok{color:#156c43}.foot{text-align:center;font-size:13px;color:#777;margin-top:18px}.foot a{color:#111;font-weight:700;text-decoration:none}
</style></head><body><div class="box"><div class="brand">DAHAM<small>INTERIOR COMPANY</small></div><div class="title">관리자 계정 만들기</div><div class="sub">DAHAM 서버에 사용할 첫 관리자 계정을 생성합니다.<br>이메일이 로그인 아이디가 됩니다.</div><form id="form"><div class="field"><label>사용자 이름</label><input id="name" autocomplete="name" placeholder="예: 대표 관리자" required></div><div class="field"><label>로그인 아이디(이메일)</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com" required></div><div class="field"><label>비밀번호</label><input id="password" type="password" autocomplete="new-password" placeholder="8자 이상" required></div><div class="field"><label>비밀번호 확인</label><input id="password2" type="password" autocomplete="new-password" required></div><button class="btn" id="submitBtn">계정 생성</button><div class="msg" id="msg"></div></form><div class="foot">이미 계정이 있으면 <a href="login.html">로그인</a></div></div><script src="auth.js"></script><script>
const signupForm=document.getElementById('form');
const nameInput=document.getElementById('name');
const emailInput=document.getElementById('email');
const passwordInput=document.getElementById('password');
const password2Input=document.getElementById('password2');
const submitButton=document.getElementById('submitBtn');
const messageBox=document.getElementById('msg');

(async()=>{if(await DAHAM_AUTH.hasAccount()){location.replace('login.html')}})();
signupForm.onsubmit=async e=>{
  e.preventDefault();
  messageBox.className='msg';
  messageBox.textContent='';
  if(passwordInput.value!==password2Input.value){messageBox.textContent='비밀번호가 서로 다릅니다.';return}
  submitButton.disabled=true;
  try{
    const result=await DAHAM_AUTH.createAccount({
      email:emailInput.value,
      password:passwordInput.value,
      name:nameInput.value
    });
    if(result.needsConfirmation){
      messageBox.className='msg ok';
      messageBox.textContent='계정이 생성되었습니다. 입력한 이메일로 온 인증 메일을 확인한 뒤 로그인해주세요.';
      setTimeout(()=>location.href='login.html',2600)
    }else{
      location.href='index.html'
    }
  }catch(err){
    messageBox.textContent=err?.message||'계정 생성에 실패했습니다.'
  }finally{
    submitButton.disabled=false
  }
};
</script></body></html>
