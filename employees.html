<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAHAM — 직원관리</title>
<style>:root{--navy:#172238;--bg:#f6f8fb;--card:#fff;--line:#e5e9f0;--text:#1f2937;--muted:#7c8799;--purple:#7058e8;--green:#249d67;--red:#d75863}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,"Noto Sans KR",Arial,sans-serif}.top{height:68px;padding:0 max(24px,calc((100% - 1180px)/2));background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;letter-spacing:.08em}.top a{color:#dce3ef;text-decoration:none;font-size:13px}.wrap{max-width:1180px;margin:0 auto;padding:38px 24px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.head h1{margin:0 0 7px;font-size:28px}.head p{margin:0;color:var(--muted);font-size:13px}.refresh{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 14px;font-weight:700}.notice{min-height:22px;margin-bottom:12px;color:var(--red);font-size:13px}.table{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 10px 30px #1822380d}.row{display:grid;grid-template-columns:minmax(180px,1.5fr) minmax(200px,1.4fr) 120px 120px 180px;gap:14px;align-items:center;padding:15px 18px;border-bottom:1px solid #eef1f5}.row:last-child{border-bottom:0}.row.header{background:#fafbfc;color:var(--muted);font-size:11px;font-weight:800}.name b{display:block;font-size:14px}.name small{color:var(--muted)}.badge{display:inline-flex;width:max-content;padding:6px 9px;border-radius:99px;background:#eef1f5;font-size:11px;font-weight:800}.badge.active{background:#ebf8f2;color:var(--green)}.badge.pending{background:#fff3e8;color:#bd6c23}.controls{display:flex;gap:7px}.controls button,.controls select{height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 9px;font-size:11px}.controls button.stop{color:var(--red)}.controls button.approve{background:var(--purple);border-color:var(--purple);color:#fff}.owner{color:var(--muted);font-size:12px}.empty{padding:50px;text-align:center;color:var(--muted)}@media(max-width:800px){.row{grid-template-columns:1fr 1fr}.row.header{display:none}.controls{grid-column:1/-1}.head{align-items:flex-start}.email{word-break:break-all}}</style><script src="auth.js"></script></head>
<body><header class="top"><div class="brand">DAHAM INTERIOR</div><a href="index.html">← 대시보드</a></header><main class="wrap"><div class="head"><div><h1>직원관리</h1><p>직원 가입 승인, 사용중지 및 권한을 관리합니다.</p></div><button class="refresh" id="refreshBtn">새로고침</button></div><div class="notice" id="notice" aria-live="polite"></div><section class="table"><div class="row header"><span>직원</span><span>이메일</span><span>권한</span><span>상태</span><span>관리</span></div><div id="employeeRows"><div class="empty">직원 목록을 불러오는 중입니다.</div></div></section></main>
<script>const rowsBox=document.getElementById('employeeRows'),notice=document.getElementById('notice');const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));let employees=[];function render(){if(!employees.length){rowsBox.innerHTML='<div class="empty">등록된 직원이 없습니다.</div>';return}rowsBox.innerHTML=employees.map(employee=>{const isOwner=employee.role==='owner',status=employee.is_active?'사용 중':'승인 대기 / 중지';const controls=isOwner?'<span class="owner">대표 계정은 변경할 수 없습니다.</span>':`<select data-role="${employee.id}"><option value="staff" ${employee.role==='staff'?'selected':''}>staff</option><option value="admin" ${employee.role==='admin'?'selected':''}>admin</option></select><button class="${employee.is_active?'stop':'approve'}" data-active="${employee.id}">${employee.is_active?'사용중지':'승인'}</button>`;return `<div class="row"><div class="name"><b>${escapeHtml(employee.display_name||employee.username||'이름 없음')}</b><small>${isOwner?'대표':'직원'}</small></div><div class="email">${escapeHtml(employee.email||employee.username||'')}</div><span class="badge">${escapeHtml(employee.role)}</span><span class="badge ${employee.is_active?'active':'pending'}">${status}</span><div class="controls">${controls}</div></div>`}).join('');rowsBox.querySelectorAll('[data-role]').forEach(select=>select.onchange=()=>changeRole(select.dataset.role,select.value));rowsBox.querySelectorAll('[data-active]').forEach(button=>button.onclick=()=>toggleActive(button.dataset.active))}async function loadEmployees(){notice.textContent='';try{employees=await DAHAM_AUTH.listEmployees();render()}catch(error){notice.textContent=error?.message||'직원 목록을 불러오지 못했습니다.'}}async function changeRole(id,role){try{await DAHAM_AUTH.updateEmployee(id,{role:role});await loadEmployees()}catch(error){notice.textContent=error?.message||'권한을 변경하지 못했습니다.';await loadEmployees()}}async function toggleActive(id){const employee=employees.find(item=>item.id===id);if(!employee)return;try{await DAHAM_AUTH.updateEmployee(id,{is_active:!employee.is_active});await loadEmployees()}catch(error){notice.textContent=error?.message||'상태를 변경하지 못했습니다.';await loadEmployees()}}refreshBtn.onclick=loadEmployees;(async()=>{if(!await DAHAM_AUTH.ready)return;const user=DAHAM_AUTH.currentUser();if(!user||user.role!=='owner'){alert('직원 관리는 대표만 사용할 수 있습니다.');location.replace('index.html');return}await loadEmployees()})();</script></body></html>
