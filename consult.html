<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --orange:#E65100;--orange-lt:#FFF3EE;--orange-dk:#BF360C;
  --ink:#1a1a1a;--mid:#555;--dim:#aaa;
  --line:#e0e0e0;--line-lt:#f5f5f5;--bg:#f0f0f0;--white:#fff;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:13px;min-height:100vh}

.toolbar{position:sticky;top:0;z-index:200;height:48px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;background:var(--white);border-bottom:2.5px solid var(--orange);box-shadow:0 2px 10px rgba(0,0,0,.07)}
.brand{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.12em;color:var(--orange)}
.tb-home{font-size:11px;color:var(--mid);text-decoration:none;border:1.5px solid var(--line);padding:4px 10px;transition:all .15s}
.tb-home:hover{border-color:#333;color:#333}
.tb-add-btn{font-family:var(--sans);font-size:12px;font-weight:700;padding:7px 14px;background:var(--orange);color:#fff;border:none;cursor:pointer;transition:background .15s}
.tb-add-btn:hover{background:var(--orange-dk)}

.tab-wrap{background:var(--white);border-bottom:1px solid var(--line);padding:0 20px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
.tab-wrap::-webkit-scrollbar{display:none}
.tab-btn{display:inline-block;padding:11px 13px;font-size:12px;font-weight:600;color:var(--dim);cursor:pointer;border-bottom:2.5px solid transparent;transition:all .15s;border:none;background:none;font-family:var(--sans)}
.tab-btn.active{color:var(--orange);border-bottom-color:var(--orange)}
.tab-count{display:inline-block;font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;margin-left:4px;background:var(--line-lt);color:var(--mid)}
.tab-btn.active .tab-count{background:var(--orange-lt);color:var(--orange)}

.main{max-width:1000px;margin:0 auto;padding:20px 16px 100px}

/* 테이블 */
.tbl-wrap{background:var(--white);border-radius:12px;box-shadow:0 1px 8px rgba(0,0,0,.07);overflow-x:auto;-webkit-overflow-scrolling:touch}
.consult-table{width:100%;border-collapse:collapse;min-width:600px}
.consult-table thead tr{background:#fafafa;border-bottom:2px solid var(--line)}
.consult-table th{padding:11px 14px;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--dim);text-align:left;white-space:nowrap}
.consult-table td{padding:13px 14px;border-bottom:1px solid var(--line-lt);font-size:13px;vertical-align:middle}
.consult-table tbody tr:last-child td{border-bottom:none}
.consult-table tbody tr{cursor:pointer;transition:background .1s}
.consult-table tbody tr:hover{background:#fafafa}
.ct-num{color:var(--dim);font-size:12px}
.ct-badge{font-size:9px;font-weight:700;padding:3px 9px;border-radius:4px;white-space:nowrap;display:inline-block}
.ct-name{font-size:14px;font-weight:800}
.ct-sub{font-size:11px;color:var(--mid);margin-top:2px}
.ct-proj{font-size:10px;font-weight:700;color:var(--orange);background:var(--orange-lt);padding:2px 7px;border-radius:4px;text-decoration:none;margin-left:6px;vertical-align:middle}
.ct-date{font-size:12px;color:var(--mid);white-space:nowrap}
.consult-delete-cell{width:1%;text-align:right;white-space:nowrap}
.consult-delete-btn{font-family:var(--sans);font-size:11px;font-weight:700;color:#C62828;background:#fff;border:1px solid #FFCDD2;border-radius:7px;padding:6px 9px;cursor:pointer}
.consult-delete-btn:hover{background:#FFEBEE;border-color:#EF9A9A}
.empty-state{text-align:center;padding:60px 20px;color:var(--dim)}
.empty-icon{font-size:40px;margin-bottom:12px}

/* 모바일: 불필요한 컬럼 숨김 */
@media(max-width:580px){
  .main{padding:14px 10px 100px}
  .consult-table{min-width:0}
  .tbl-wrap{border-radius:8px}
  .col-hide-mobile{display:none}
  .consult-table th{padding:9px 10px;font-size:9px}
  .consult-table td{padding:11px 10px;font-size:12px}
  .ct-name{font-size:13px}
}

/* 모달 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:flex-end;justify-content:center}
.modal-box{background:var(--white);width:100%;max-width:640px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:660px){.modal-overlay{align-items:center}.modal-box{border-radius:16px;max-height:88vh}}
.modal-hd{padding:16px 20px 12px;border-bottom:1px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:16px;font-weight:800}
.modal-close{font-size:22px;color:var(--dim);background:none;border:none;cursor:pointer;padding:2px;line-height:1}
.modal-body{overflow-y:auto;padding:20px;flex:1;min-height:0}
.modal-ft{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;flex-shrink:0;background:var(--white)}

/* 마일스톤 진행 바 */
.mbar{padding:14px 20px;background:#fafafa;border-bottom:2px solid var(--line);flex-shrink:0}
.mbar-label{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.mbar-steps{display:flex;align-items:center;gap:0;overflow-x:auto}
.mbar-steps::-webkit-scrollbar{display:none}
.mstep{display:flex;align-items:center;gap:0;flex-shrink:0}
.mstep-btn{padding:8px 16px;border:2px solid var(--line);border-radius:0;cursor:pointer;font-size:12px;font-weight:700;transition:all .15s;background:var(--white);color:var(--mid);font-family:var(--sans);white-space:nowrap;position:relative}
.mstep-btn:first-child,.mstep:first-child .mstep-btn{border-radius:8px 0 0 8px}
.mstep:not(:first-child) .mstep-btn{border-left:none}
.mstep-btn:hover{background:#f5f5f5;color:var(--ink);z-index:1}
.mstep-btn.active{border-color:var(--sc,#757575);background:var(--sb,#F5F5F5);color:var(--sc,#757575);z-index:2}
/* 계약 버튼 — 단독 오른쪽 */
.mstep-contract{margin-left:10px;flex-shrink:0}
.mstep-contract .mstep-btn{border-radius:8px;border:2px solid #2E7D32;color:#2E7D32;background:#fff;font-size:12px;padding:8px 18px}
.mstep-contract .mstep-btn:hover{background:#E8F5E9}
.mstep-contract .mstep-btn.active{background:#2E7D32;color:#fff;border-color:#2E7D32}
.mbar-hint{font-size:10px;color:var(--dim);margin-top:8px}

/* 폼 */
.sec-title{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--dim);margin-bottom:10px;margin-top:20px}
.sec-title:first-child{margin-top:0}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:11px;font-weight:700;color:var(--mid);margin-bottom:5px}
.form-row input,.form-row textarea,.form-row select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;font-family:var(--sans);font-size:13px;outline:none;transition:border-color .15s;background:var(--white);color:var(--ink)}
.form-row input:focus,.form-row textarea:focus,.form-row select:focus{border-color:var(--orange)}
.form-row textarea{resize:vertical;min-height:70px;line-height:1.6}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* 마일스톤 이력 테이블 */
.ms-table{width:100%;border-collapse:collapse;margin-top:4px}
.ms-table th{font-size:9px;font-weight:700;color:var(--dim);letter-spacing:.05em;padding:4px 8px 8px;text-align:left}
.ms-table td{padding:6px 8px;border-bottom:1px solid var(--line-lt);vertical-align:middle}
.ms-table tr:last-child td{border-bottom:none}
.ms-stage-pill{font-size:10px;font-weight:700;padding:4px 10px;border-radius:10px;white-space:nowrap;display:inline-block}
.ms-dt-inp{font-family:var(--sans);font-size:11px;border:1.5px solid var(--line);border-radius:6px;padding:5px 7px;outline:none;width:100%;min-width:155px;color:var(--ink);background:var(--white)}
.ms-dt-inp:focus{border-color:var(--orange)}
.ms-memo-inp{font-family:var(--sans);font-size:12px;border:1.5px solid var(--line);border-radius:6px;padding:5px 8px;outline:none;width:100%;color:var(--ink);background:var(--white)}
.ms-memo-inp:focus{border-color:var(--orange)}
.ms-del-btn{background:none;border:none;color:#ccc;font-size:18px;cursor:pointer;padding:2px 5px;line-height:1;transition:color .1s}
.ms-del-btn:hover{color:#e53935}
/* 텍스트 노트 */
.note-row{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid var(--line-lt)}
.note-dot{width:7px;height:7px;border-radius:50%;background:#bbb;flex-shrink:0;margin-top:4px}
.note-text{flex:1;font-size:11px;color:var(--mid);line-height:1.5}
.note-time{font-size:10px;color:var(--dim);white-space:nowrap;flex-shrink:0}
/* 메모 추가 */
.hist-add-row{display:flex;gap:8px;margin-top:12px}
.hist-add-row input{flex:1;padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:12px;font-family:var(--sans);outline:none}
.hist-add-row input:focus{border-color:var(--orange)}
.hist-add-btn{padding:9px 14px;background:var(--orange);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--sans);white-space:nowrap}

/* 버튼 */
.btn{font-family:var(--sans);font-size:13px;font-weight:700;padding:12px 20px;border-radius:10px;cursor:pointer;transition:all .15s;border:none}
.btn-save{background:var(--orange);color:#fff;flex:1}
.btn-save:hover{background:var(--orange-dk)}
.btn-del{background:var(--line-lt);color:#C62828;flex:0 0 auto}
.btn-del:hover{background:#FFEBEE}
.btn-proj{background:#FFF3EE;color:var(--orange);flex:0 0 auto;border:1.5px solid var(--orange)}
.btn-proj:hover{background:var(--orange);color:#fff}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#333;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:all .3s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 상담/현장실측 2026 workspace */

.consult-shell{display:grid;grid-template-columns:196px minmax(0,1fr);height:100vh;min-width:0}.consult-nav{background:linear-gradient(180deg,#0b1b46,#071536);color:#fff;padding:26px 14px 18px;display:flex;flex-direction:column;min-width:0}.consult-logo{font-size:27px;font-weight:900;letter-spacing:.09em;padding:0 13px 31px}.consult-logo small{display:block;font-size:10px;font-weight:500;letter-spacing:0;margin-top:6px;color:#aeb9d3}.consult-menu{display:grid;gap:7px}.consult-menu a{min-height:48px;border-radius:9px;padding:0 14px;color:#d4dcf1;text-decoration:none;display:flex;align-items:center;gap:11px;font-weight:650}.consult-menu a.active{background:linear-gradient(135deg,#7450e8,#5932cb);color:#fff}.consult-user{margin-top:auto;border-top:1px solid rgba(255,255,255,.18);padding:18px 10px 0;display:flex;gap:10px;align-items:center}.consult-user-mark{width:34px;height:34px;border-radius:50%;background:#dbe2f3;color:#24345c;display:grid;place-items:center;font-weight:850}.consult-app{min-width:0;display:grid;grid-template-rows:90px minmax(0,1fr)}.consult-top{background:#fff;border-bottom:1px solid var(--consult-border);padding:18px 25px;display:flex;align-items:center;justify-content:space-between;gap:18px}.consult-top h1{font-size:25px;line-height:1.15}.consult-top p{color:var(--consult-muted);margin-top:6px}.consult-top-actions{display:flex;align-items:center;gap:9px}.consult-add{min-height:44px;border:0;border-radius:8px;background:linear-gradient(135deg,#7046e6,#5a30cf);color:#fff;padding:0 18px;font-weight:800;cursor:pointer}.consult-workspace{display:grid;grid-template-columns:390px minmax(0,1fr);gap:10px;padding:8px;min-height:0;min-width:0}.consult-list-panel,.consult-detail-panel{background:#fff;border:1px solid var(--consult-border);border-radius:10px;min-width:0;min-height:0}.consult-list-panel{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto}.consult-list-head{padding:15px 16px 10px;display:flex;align-items:center;justify-content:space-between}.consult-list-head h2{font-size:15px}.consult-search{margin:0 14px 10px;min-height:40px;border:1px solid var(--consult-border);border-radius:8px;padding:0 12px;width:calc(100% - 28px);font:inherit}.consult-list-scroll{overflow-y:auto;padding:0 10px 12px}.consult-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 10px 10px}.consult-tabs .tab-btn{border:1px solid var(--consult-border);border-radius:7px;padding:8px 4px;white-space:normal}.consult-tabs .tab-btn.active{border-color:var(--consult-purple);background:var(--consult-purple-soft);color:var(--consult-purple)}.consult-card{width:100%;text-align:left;border:1px solid var(--consult-border);background:#fff;border-radius:9px;padding:15px;margin-bottom:8px;cursor:pointer;font:inherit}.consult-card:hover,.consult-card.active{border-color:var(--consult-purple);box-shadow:0 0 0 1px var(--consult-purple)}.consult-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.consult-card-name{font-size:15px;font-weight:850}.consult-card-address{font-size:12px;color:#565e72;margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.consult-card-meta{display:flex;gap:13px;color:#737b8e;font-size:11px;margin-top:10px}.consult-card-scopes{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.scope-tag{background:#f4f5f8;border:1px solid #e2e5ec;border-radius:5px;padding:3px 7px;font-size:10px}.consult-detail-panel{overflow-y:auto;padding:14px}.detail-empty{height:100%;display:grid;place-items:center;color:var(--consult-muted)}.detail-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.detail-title{display:flex;align-items:center;gap:9px}.detail-title h2{font-size:20px}.detail-actions{display:flex;gap:8px}.outline-btn{min-height:40px;border:1px solid var(--consult-border);background:#fff;border-radius:7px;padding:0 13px;font-weight:700;cursor:pointer}.detail-grid{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:9px}.info-card{border:1px solid var(--consult-border);border-radius:8px;padding:13px;min-width:0}.info-card h3,.scope-section h3,.survey-section h3{font-size:13px;margin-bottom:12px}.info-lines{display:grid;grid-template-columns:82px minmax(0,1fr);gap:9px;font-size:12px}.info-lines dt{color:#858c9e}.info-lines dd{overflow-wrap:anywhere}.scope-section{border:1px solid var(--consult-border);border-radius:8px;padding:13px;margin-top:10px}.scope-grid{display:grid;grid-template-columns:repeat(8,minmax(84px,1fr));gap:7px}.scope-chip{min-height:46px;border:1px solid var(--consult-border);border-radius:7px;background:#fff;font:inherit;font-weight:650;color:#5c6477}.scope-chip.selected{border-color:var(--consult-purple);background:var(--consult-purple-soft);color:var(--consult-purple)}.scope-details{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:10px}.scope-detail-card{border:1px solid var(--consult-border);border-radius:7px;padding:10px;min-width:0}.scope-detail-card h4{font-size:12px;margin-bottom:8px}.survey-section{border:1px solid var(--consult-border);border-radius:8px;padding:13px;margin-top:10px}.survey-grid{display:grid;grid-template-columns:1fr 1fr 1.2fr 1.5fr 1.4fr;gap:8px}.survey-item{border:1px solid #edf0f5;border-radius:7px;padding:10px;min-width:0}.survey-item span{display:block;color:#868da0;font-size:10px;margin-bottom:6px}.survey-item strong,.survey-item a{font-size:12px;overflow-wrap:anywhere}.detail-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}.detail-footer .primary{background:var(--consult-purple);color:#fff;border-color:var(--consult-purple)}

<script>
var DB_KEY  = 'daham_consult_v1';
var PROJ_DB = 'daham_detail_v2';
var GENERAL_SCHEDULE_DB_KEY = 'daham_schedule_general_v1';
var _AUTH_CONFIG = DAHAM_AUTH.getSupabaseConfig();
var SUPA_URL = _AUTH_CONFIG.url;
var SUPA_KEY = _AUTH_CONFIG.key;
var _sb = null;

/* 마일스톤 단계 (상단 버튼) */
var MS_CONFIG = {
  inquiry:     { label:'상담문의', color:'#757575', bg:'#F5F5F5' },
  site_check:  { label:'현장실측', color:'#0277BD', bg:'#E1F5FE' },
  est_meeting: { label:'견적미팅', color:'#E65100', bg:'#FFF3EE' },
  est_done:    { label:'견적완료', color:'#6A1B9A', bg:'#F3E5F5' },
  contracted:  { label:'계약',     color:'#2E7D32', bg:'#E8F5E9' },
};
var MS_ACTIVE  = ['inquiry','site_check','est_meeting','est_done']; /* 진행 단계 */
var MS_ORDER   = ['inquiry','site_check','est_meeting','est_done','contracted'];

/* 구버전 상태 호환 */
var MS_COMPAT = {
  scheduled:  { label:'상담 예정', color:'#1565C0', bg:'#E3F2FD' },
  estimating: { label:'견적 진행', color:'#E65100', bg:'#FFF3EE' },
  pending:    { label:'보류',      color:'#F57F17', bg:'#FFF8E1' },
  cancelled:  { label:'취소',      color:'#C62828', bg:'#FFEBEE' },
};

function getStatusCfg(s){
  return MS_CONFIG[s] || MS_COMPAT[s] || { label:s, color:'#aaa', bg:'#f5f5f5' };
}
function isActive(s){ return MS_ACTIVE.indexOf(s)>=0 || ['scheduled','estimating','pending','cancelled'].indexOf(s)>=0; }

var _filter      = 'active';
var _editId      = null;
var _records     = [];
var _modalHist   = []; /* 모달 세션용 이력 작업본 */
var _curStatus   = 'inquiry'; /* 모달 현재 선택 단계 */
var _currentUser = null;
var _canDeleteConsult = false;
var _selectedId = null;
var CONSULT_SCOPES=['도배','바닥','욕실','전기·조명','샷시','가구','목작업','문·문틀','설비','타일','필름','탄성코트','시스템에어컨','중문','철거','기타'];

/* ════ CLOUD SYNC ════ */
function initCloud(){
  try{
    var token = window.DAHAM_AUTH && DAHAM_AUTH.getAccessToken ? DAHAM_AUTH.getAccessToken() : '';
    _sb=window.supabase.createClient(SUPA_URL,SUPA_KEY,{
      global:{headers: token ? {Authorization:'Bearer '+token} : {}} ,
      auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}
    });
  }catch(e){ _sb=null; }
}
function setSyncDot(state){
  var el=document.getElementById('sync-dot');
  if(!el) return;
  if(state==='up'){ el.textContent='↑'; el.style.opacity='1'; el.style.color='var(--orange)'; }
  else if(state==='ok'){ el.textContent='☁'; el.style.opacity='.35'; el.style.color='inherit'; }
  else if(state==='err'){ el.textContent='⚠'; el.style.opacity='1'; el.style.color='#e53935'; }
}
function cloudPush(arr){
  if(!_sb) return;
  setSyncDot('up');
  var str=JSON.stringify(arr);
  var ts=new Date().toISOString();
  localStorage.setItem(DB_KEY+'_ts',ts);
  _sb.from('sync_data').upsert({key:DB_KEY,value:str,updated_at:ts})
    .then(function(r){ setSyncDot(r.error?'err':'ok'); });
}
function cloudPull(onDone){
  if(!_sb){ onDone&&onDone(); return; }
  _sb.from('sync_data').select('value,updated_at').eq('key',DB_KEY).maybeSingle()
    .then(function(r){
      if(r.error||!r.data){ setSyncDot('ok'); onDone&&onDone(); return; }
      var localTs=localStorage.getItem(DB_KEY+'_ts')||'';
      if(r.data.updated_at>localTs){
        try{
          var parsed=JSON.parse(r.data.value);
          localStorage.setItem(DB_KEY,JSON.stringify(parsed));
          localStorage.setItem(DB_KEY+'_ts',r.data.updated_at);
          showToast('☁ 클라우드에서 동기화됨');
          renderTabs(); renderList();
        }catch(e){}
      }
      setSyncDot('ok'); onDone&&onDone();
    });
}

function loadGeneralScheduleEvents(){
  try{var value=JSON.parse(localStorage.getItem(GENERAL_SCHEDULE_DB_KEY)||'[]');return Array.isArray(value)?value:[];}catch(e){return [];}
}
function saveGeneralScheduleEvents(events,ts){
  localStorage.setItem(GENERAL_SCHEDULE_DB_KEY,JSON.stringify(events));
  localStorage.setItem(GENERAL_SCHEDULE_DB_KEY+'_ts',ts);
}
function syncConsultSchedule(record,mode){
  if(!record||!window.DAHAM_CONSULT_SCHEDULE) return Promise.resolve([]);
  var reconcileAt=nowISO();
  var localEvents=loadGeneralScheduleEvents();
  var nextLocal=DAHAM_CONSULT_SCHEDULE.reconcile(localEvents,record,mode||'save',reconcileAt);
  saveGeneralScheduleEvents(nextLocal,reconcileAt);
  if(!_sb) return Promise.resolve(nextLocal);
  setSyncDot('up');
  return _sb.from('sync_data').select('value,updated_at').eq('key',GENERAL_SCHEDULE_DB_KEY).maybeSingle()
    .then(function(result){
      if(result.error) throw result.error;
      var remoteEvents=[];
      try{remoteEvents=result.data&&JSON.parse(result.data.value||'[]')||[];}catch(e){remoteEvents=[];}
      if(!Array.isArray(remoteEvents)) remoteEvents=[];
      var merged=DAHAM_CONSULT_SCHEDULE.mergeEventCollections(remoteEvents,nextLocal);
      var nextRemote=DAHAM_CONSULT_SCHEDULE.reconcile(merged,record,mode||'save',reconcileAt);
      var ts=nowISO();
      saveGeneralScheduleEvents(nextRemote,ts);
      return _sb.from('sync_data').upsert({key:GENERAL_SCHEDULE_DB_KEY,value:JSON.stringify(nextRemote),updated_at:ts})
        .then(function(writeResult){if(writeResult.error)throw writeResult.error;setSyncDot('ok');return nextRemote;});
    })
    .catch(function(){setSyncDot('err');return nextLocal;});
}

/* 이력 섹션 */
function renderHistSection(){
  var el=document.getElementById('hist-section');
  if(!el) return;

  var milestones=[], notes=[];
  _modalHist.forEach(function(h,i){
    if(h.type==='milestone') milestones.push({h:h,i:i});
    else notes.push({h:h,i:i});
  });

  var record=_editId?_records.find(function(x){return x.id===_editId;}):null;
  var managerEl=document.getElementById('f-manager');
  var manager=(managerEl&&managerEl.value)||(record&&record.manager)||(_currentUser&&(_currentUser.full_name||_currentUser.name||_currentUser.email))||'담당자';
  var stages=MS_ACTIVE.concat(['contracted']);
  var track='<div class="consult-history-track">'+stages.map(function(status){
    var latest=null;
    milestones.forEach(function(obj){if(obj.h.status===status)latest=obj.h;});
    var sc=getStatusCfg(status);
    var active=status===_curStatus;
    var detail=latest?fmtDateTime(latest.at)+' · '+manager:(active?'현재 단계':'—');
    return '<div class="consult-history-step'+(active?' current':'')+'"><strong>'+sc.label+'</strong><small>'+escHtml(detail)+'</small></div>';
  }).join('')+'</div>';

  var msHtml='';
  if(milestones.length){
    msHtml='<div class="consult-history-log">'+milestones.slice().reverse().map(function(obj){
      var h=obj.h,idx=obj.i,sc=getStatusCfg(h.status);
      return '<div class="consult-history-log-row">'
        +'<span class="ms-stage-pill" style="background:'+sc.bg+';color:'+sc.color+'">'+sc.label+'</span>'
        +'<input class="ms-dt-inp" type="datetime-local" value="'+escAttr(h.at||'')+'" oninput="updateMs('+idx+',\'at\',this.value)">'
        +'<input class="ms-memo-inp" type="text" placeholder="진행 메모" value="'+escAttr(h.memo||'')+'" oninput="updateMs('+idx+',\'memo\',this.value)">'
        +'<button class="ms-del-btn" onclick="deleteMilestone('+idx+')" title="이력 삭제">×</button></div>';
    }).join('')+'</div>';
  }

  var notesHtml='';
  if(notes.length){
    notesHtml='<div style="margin-top:8px">'
      +notes.slice().reverse().map(function(obj){
        var h=obj.h;
        return '<div class="note-row"><div class="note-dot"></div>'
          +'<div class="note-text">'+escHtml(h.text||'')+'</div>'
          +'<div class="note-time">'+fmtDateTime(h.at)+'</div></div>';
      }).join('')+'</div>';
  }

  el.innerHTML=track+msHtml+notesHtml
    +'<div class="hist-add-row">'
    +'<input id="f-hist-note" placeholder="상담 진행 중 메모를 입력하세요">'
    +'<button class="hist-add-btn" onclick="addHistNote()">메모 추가</button>'
    +'</div>';
}

/* 저장 */
function saveModal(){
  var consultTitle=(document.getElementById('f-consult-title').value||'').trim();
  var consultContent=(document.getElementById('f-consult-content').value||'').trim();
  var name    =(document.getElementById('f-name').value||'').trim();
  var tel     =(document.getElementById('f-tel').value||'').trim();
  var email   =(document.getElementById('f-email').value||'').trim();
  var altTel  =(document.getElementById('f-alt-tel').value||'').trim();
  var postcode=(document.getElementById('f-postcode').value||'').trim();
  var addr    =(document.getElementById('f-addr').value||'').trim();
  var addrDetail=(document.getElementById('f-addr-detail').value||'').trim();
  var siteName=(document.getElementById('f-site-name').value||'').trim();
  var unit    =(document.getElementById('f-unit').value||'').trim();
  var area    =(document.getElementById('f-area').value||'').trim();
  var buildYear=(document.getElementById('f-build-year').value||'').trim();
  var housingType=document.getElementById('f-housing-type').value||'';
  var sdate   =document.getElementById('f-sdate').value||'';
  var stime   =document.getElementById('f-stime').value||'';
  var splace  =document.getElementById('f-splace').value||'';
  var manager =(document.getElementById('f-manager').value||'').trim();
  var works   =(document.getElementById('f-works').value||'').trim();
  var budget  =(document.getElementById('f-budget').value||'').trim();
  var moveDate=document.getElementById('f-movedate').value||'';
  var memo    =(document.getElementById('f-memo').value||'').trim();
  var scopes=[].slice.call(document.querySelectorAll('.scope-check:checked')).map(function(x){return x.value;});
  var scopeDetails=readScopeDetails();
  var source=(document.getElementById('f-source').value||'').trim();
  var survey={visitDate:document.getElementById('f-visit-date').value||'',measured:document.getElementById('f-measured').checked,polycamDone:document.getElementById('f-polycam-done').checked,polycamUrl:(document.getElementById('f-polycam-url').value||'').trim(),photoUrls:(document.getElementById('f-photo-urls').value||'').split(/\r?\n/).map(function(x){return x.trim();}).filter(Boolean),note:(document.getElementById('f-survey-note').value||'').trim()};
  var status  =_curStatus;

  if(!name&&!tel){ showToast('고객명 또는 연락처를 입력하세요'); return; }

  var db=loadDB();
  var projCreated=false, newProjId=null;
  var isContract=status==='contracted';

  /* 새 상담용 ID를 미리 생성해 프로젝트 연결에 사용 */
  var newId=_editId?null:uid();

  /* 계약 단계 진입 → 프로젝트 생성 */
  var prevProjId=null;
  var prevR=null;
  if(_editId){
    prevR=db.find(function(r){return r.id===_editId;});
    if(prevR) prevProjId=prevR.projId;
  }
  if(isContract&&!prevProjId){
    newProjId=createEstimateProject({name:name,tel:tel,addr:addr,area:area,consultId:_editId||newId});
    _modalHist.push({type:'note',text:'프로젝트 자동 생성됨',at:nowISO()});
    projCreated=true;
  }

  var scheduleDraft={status:status,schedDate:sdate,schedTime:stime};
  var scheduleReservations=DAHAM_CONSULT_SCHEDULE.updateReservations(prevR,scheduleDraft,nowISO());

  if(_editId){
    var idx=db.findIndex(function(r){return r.id===_editId;});
    if(idx<0){closeModal();return;}
    db[idx]=Object.assign({},db[idx],{
      consultTitle:consultTitle,consultContent:consultContent,name:name,tel:tel,email:email,altTel:altTel,postcode:postcode,addr:addr,addrDetail:addrDetail,siteName:siteName,unit:unit,area:area,buildYear:buildYear,housingType:housingType,manager:manager,
      schedDate:sdate,schedTime:stime,schedPlace:splace,
      works:works,scopes:scopes,scopeDetails:scopeDetails,budget:budget,moveDate:moveDate,memo:memo,source:source,survey:survey,status:status,
      history:_modalHist.slice(),scheduleReservations:scheduleReservations,updatedAt:nowISO()
    });
    if(newProjId) db[idx].projId=newProjId;
  } else {
    db.push({
      id:newId,createdAt:nowISO(),updatedAt:nowISO(),
      consultTitle:consultTitle,consultContent:consultContent,name:name,tel:tel,email:email,altTel:altTel,postcode:postcode,addr:addr,addrDetail:addrDetail,siteName:siteName,unit:unit,area:area,buildYear:buildYear,housingType:housingType,manager:manager,
      schedDate:sdate,schedTime:stime,schedPlace:splace,
      works:works,scopes:scopes,scopeDetails:scopeDetails,budget:budget,moveDate:moveDate,memo:memo,source:source,survey:survey,status:status,
      projId:newProjId||null,history:_modalHist.slice(),scheduleReservations:scheduleReservations
    });
  }

  saveDB(db);
  _selectedId=_editId||newId;
  var savedRecord=db.find(function(r){return r.id===_selectedId;});
  syncConsultSchedule(savedRecord,'save');
  closeModal();
  renderTabs();
  renderList();
  if(isContract) showToast(projCreated?'✓ 계약 완료! 프로젝트가 생성됐습니다':'✓ 계약 완료! 목록에서 제외됩니다');
  else showToast('✓ 저장됐습니다');
}

/* 프로젝트 생성 */
function createEstimateProject(info){
  try{
    var projects=JSON.parse(localStorage.getItem(PROJ_DB)||'[]');
    var id=uid();
    projects.push({
      id:id,createdAt:nowISO(),updatedAt:nowISO(),
      status:'estimate',contracted:false,completed:false,consultId:info.consultId||null,
      client:{'cl-name':info.name||'','cl-tel':info.tel||'','cl-date':nowISO().slice(0,10),
        'cl-movein':'','cl-addr':info.addr||'','cl-area':info.area||'','cl-start':'','cl-end':''},
      margins:{mat:'5',profit:'15'},qtys:{},sectionTotals:null
    });
    localStorage.setItem(PROJ_DB,JSON.stringify(projects));
    return id;
  }catch(e){return null;}
}

/* 텍스트 메모 추가 */
function addHistNote(){
  var note=(document.getElementById('f-hist-note').value||'').trim();
  if(!note) return;
  _modalHist.push({type:'note',text:note,at:nowISO()});
  if(_editId){
    var db=loadDB();
    var idx=db.findIndex(function(r){return r.id===_editId;});
    if(idx>=0){db[idx].history=_modalHist.slice();db[idx].updatedAt=nowISO();saveDB(db);_records=db;}
    renderTabs();renderList();
  }
  document.getElementById('f-hist-note').value='';
  renderHistSection();
  showToast('✓ 메모 추가됐습니다');
}

/* 삭제 */
function deleteRecord(id){
  if(!_canDeleteConsult){ showToast('대표 또는 관리자만 삭제할 수 있습니다.'); return; }
  if(!_sb){ showToast('DB 연결 후 다시 시도해 주세요.'); return; }
  var linkedRecord=loadDB().find(function(r){return r.id===id;});
  DAHAM_CONSULT_DELETE.removeConsult({
    id:id,
    user:_currentUser,
    confirmDelete:function(message){return window.confirm('정말 삭제하시겠습니까?');},
    rpc:function(id){return _sb.rpc('delete_consult_record',{p_record_id:id});},
    loadLocal:loadDB,
    saveLocal:function(db){localStorage.setItem(DB_KEY,JSON.stringify(db));_records=db;},
    setTimestamp:function(ts){localStorage.setItem(DB_KEY+'_ts',ts);}
  }).then(function(result){
    if(!result.deleted) return;
    syncConsultSchedule(linkedRecord,'delete');
    closeModal();renderTabs();renderList();showToast('✓ 삭제됐습니다');
  }).catch(function(error){showToast('삭제하지 못했습니다: '+error.message);});
}

function escHtml(s){ var d=document.createElement('div');d.textContent=String(s||'');return d.innerHTML; }
function escAttr(s){ return String(s||'').replace(/"/g,'&quot;'); }
var _toastTimer;
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(function(){t.classList.remove('show');},2800);
}

DAHAM_AUTH.ready.then(function(ready){
  if(!ready) return;
  _currentUser=DAHAM_AUTH.currentUser();
  _canDeleteConsult=DAHAM_CONSULT_DELETE.canDeleteConsult(_currentUser);
  initCloud();
  var requested=localStorage.getItem('daham_open_consult');
  if(requested){_selectedId=requested;localStorage.removeItem('daham_open_consult');}
  renderTabs();
  renderList();
  cloudPull();
});
</script>
</body>
