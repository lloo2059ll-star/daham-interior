<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DAHAM — A/S 관리</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E65100">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="다함">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --orange:#E65100;--orange-dk:#BF360C;--orange-lt:#FFF3EE;
  --ink:#1a1a1a;--mid:#555;--dim:#aaa;--line:#e0e0e0;--line-lt:#f5f5f5;
  --bg:#f2f2f2;--white:#fff;
  --s-pending:#EF6C00;--s-pending-lt:#FFF3E0;
  --s-doing:#1565C0;--s-doing-lt:#E3F2FD;
  --s-done:#2E7D32;--s-done-lt:#E8F5E9;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:13px;min-height:100vh}

/* ── TOOLBAR ── */
.toolbar{position:sticky;top:0;z-index:100;height:48px;padding:0 24px;
  display:flex;align-items:center;justify-content:space-between;
  background:#fff;border-bottom:2px solid var(--orange);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.brand{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.14em;color:var(--orange)}
.tb-btn{font-family:var(--sans);font-size:11px;font-weight:600;padding:6px 14px;cursor:pointer;
  border:1.5px solid var(--line);background:#fff;color:var(--mid);transition:all .15s;
  text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.tb-btn:hover{border-color:var(--ink);color:var(--ink)}
.tb-btn.primary{border-color:var(--orange);background:var(--orange);color:#fff;font-size:12px}
.tb-btn.primary:hover{background:var(--orange-dk)}

/* ── MAIN ── */
.main{max-width:900px;margin:0 auto;padding:28px 20px 80px}

/* ── STATS ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px}
.stat{background:#fff;border-radius:10px;padding:16px;text-align:center;
  box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer;border:2px solid transparent;transition:all .15s}
.stat.active{border-color:var(--orange)}
.stat:hover{border-color:var(--orange)}
.stat-n{font-size:28px;font-weight:800;font-family:'Bebas Neue',sans-serif;letter-spacing:.04em;line-height:1}
.stat-l{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-top:4px}
.stat.all .stat-n{color:var(--ink)}
.stat.pending .stat-n{color:var(--s-pending)}
.stat.doing .stat-n{color:var(--s-doing)}
.stat.done .stat-n{color:var(--s-done)}

/* ── LIST ── */
.list-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.list-title{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.search-input{font-family:var(--sans);font-size:12px;border:1.5px solid var(--line);
  padding:5px 10px;outline:none;width:200px;color:var(--ink);background:#fff}
.search-input:focus{border-color:var(--orange)}

.as-card{background:#fff;border-radius:10px;padding:16px 18px;margin-bottom:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);border:1.5px solid transparent;
  display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;transition:border-color .15s}
.as-card:hover{border-color:rgba(230,81,0,.2)}
.as-card.status-done{opacity:.7}
.as-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.as-proj{font-size:13px;font-weight:800;color:var(--ink)}
.as-date{font-size:10px;color:var(--dim)}
.status-badge{font-size:10px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:12px}
.badge-pending{background:var(--s-pending-lt);color:var(--s-pending)}
.badge-doing{background:var(--s-doing-lt);color:var(--s-doing)}
.badge-done{background:var(--s-done-lt);color:var(--s-done)}
.as-content{font-size:13px;color:var(--ink);line-height:1.6;margin-bottom:4px}
.as-resolve{font-size:11px;color:var(--s-done);margin-top:4px;line-height:1.6}
.as-client{font-size:11px;color:var(--dim);margin-top:2px}
.as-actions{display:flex;flex-direction:column;gap:5px;align-items:flex-end;flex-shrink:0}
.act-btn{font-family:var(--sans);font-size:10px;font-weight:600;padding:4px 10px;cursor:pointer;
  border:1.5px solid var(--line);background:#fff;color:var(--mid);transition:all .12s;white-space:nowrap}
.act-btn:hover{border-color:var(--orange);color:var(--orange)}
.act-btn.green{border-color:var(--s-done);color:var(--s-done)}
.act-btn.green:hover{background:var(--s-done);color:#fff}
.act-btn.blue{border-color:var(--s-doing);color:var(--s-doing)}
.act-btn.blue:hover{background:var(--s-doing);color:#fff}

.empty{text-align:center;padding:48px;color:var(--dim);font-size:12px;line-height:2;
  background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.06)}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
.modal-hd{padding:16px 20px;border-bottom:2px solid var(--orange);
  display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:15px;font-weight:800}
.modal-close{font-family:var(--sans);font-size:18px;cursor:pointer;color:var(--dim);
  background:none;border:none;line-height:1;padding:4px}
.modal-close:hover{color:var(--ink)}
.modal-body{padding:20px}
.field{margin-bottom:16px}
.field label{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;
  color:var(--dim);margin-bottom:6px}
.field input,.field textarea,.field select{
  font-family:var(--sans);font-size:13px;color:var(--ink);width:100%;
  border:1.5px solid var(--line);padding:8px 10px;outline:none;background:#fff;transition:border-color .15s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--orange)}
.field textarea{resize:vertical;min-height:72px;line-height:1.7}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-ft{padding:12px 20px;border-top:1px solid var(--line);
  display:flex;justify-content:flex-end;gap:8px}
.modal-ft button{font-family:var(--sans);font-size:12px;font-weight:600;padding:8px 20px;
  cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--mid);transition:all .15s}
.modal-ft button:hover{border-color:var(--ink);color:var(--ink)}
.modal-ft button.save{border-color:var(--orange);background:var(--orange);color:#fff}
.modal-ft button.save:hover{background:var(--orange-dk)}
.modal-ft button.del{border-color:#C62828;color:#C62828}
.modal-ft button.del:hover{background:#C62828;color:#fff}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:8px 20px;font-size:11px;
  opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}
</style>
<link rel="stylesheet" href="v2-theme.css">
<link rel="stylesheet" href="v2-suite.css">
<script defer src="v2-suite.js"></script>
</head>
<body>

<div class="toolbar">
  <div style="display:flex;align-items:center;gap:12px">
    <a href="index.html" class="tb-btn">← 홈</a>
    <span class="brand">DAHAM</span>
  </div>
  <button class="tb-btn primary" onclick="openModal()">+ 새 A/S 접수</button>
</div>

<div class="main">

  <!-- 통계 -->
  <div class="stats">
    <div class="stat all active" onclick="setFilter('all')" id="stat-all">
      <div class="stat-n" id="cnt-all">0</div>
      <div class="stat-l">전체</div>
    </div>
    <div class="stat pending" onclick="setFilter('pending')" id="stat-pending">
      <div class="stat-n" id="cnt-pending">0</div>
      <div class="stat-l">접수</div>
    </div>
    <div class="stat doing" onclick="setFilter('doing')" id="stat-doing">
      <div class="stat-n" id="cnt-doing">0</div>
      <div class="stat-l">처리중</div>
    </div>
    <div class="stat done" onclick="setFilter('done')" id="stat-done">
      <div class="stat-n" id="cnt-done">0</div>
      <div class="stat-l">완료</div>
    </div>
  </div>

  <!-- 목록 -->
  <div class="list-hd">
    <div class="list-title">A/S 접수 목록</div>
    <input class="search-input" id="search" type="text" placeholder="현장명 또는 내용 검색" oninput="renderList()">
  </div>
  <div id="as-list"></div>

</div>

<!-- MODAL -->
<div class="modal-bg" id="modal-bg" style="display:none" onclick="onBgClick(event)">
  <div class="modal">
    <div class="modal-hd">
      <div class="modal-title" id="modal-title">새 A/S 접수</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>현장명</label>
        <select id="m-proj" style="font-family:var(--sans);font-size:13px;border:1.5px solid var(--line);padding:8px 10px;outline:none;width:100%;background:#fff;color:var(--ink)">
          <option value="">-- 현장 선택 또는 직접 입력 --</option>
        </select>
      </div>
      <div class="field">
        <label>현장명 직접 입력 (선택 안 했을 때)</label>
        <input type="text" id="m-proj-text" placeholder="현장명 직접 입력">
      </div>
      <div class="field-row">
        <div class="field">
          <label>고객명</label>
          <input type="text" id="m-client" placeholder="홍길동">
        </div>
        <div class="field">
          <label>연락처</label>
          <input type="text" id="m-tel" placeholder="010-0000-0000">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>접수일</label>
          <input type="date" id="m-report-date">
        </div>
        <div class="field">
          <label>상태</label>
          <select id="m-status" style="font-family:var(--sans);font-size:13px;border:1.5px solid var(--line);padding:8px 10px;outline:none;width:100%;background:#fff;color:var(--ink)" onchange="onStatusChange()">
            <option value="pending">접수</option>
            <option value="doing">처리중</option>
            <option value="done">완료</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>하자 내용</label>
        <textarea id="m-content" placeholder="예) 거실 도배 모서리 들뜸, 화장실 수전 누수 등"></textarea>
      </div>
      <div id="resolve-fields">
        <div class="field-row">
          <div class="field">
            <label>처리 완료일</label>
            <input type="date" id="m-resolve-date">
          </div>
          <div class="field" style="display:flex;align-items:flex-end">
          </div>
        </div>
        <div class="field">
          <label>처리 내용</label>
          <textarea id="m-resolve-note" placeholder="예) 도배 재시공 완료, 수전 교체 완료 등"></textarea>
        </div>
      </div>
    </div>
    <div class="modal-ft">
      <button class="del" id="btn-del" style="display:none" onclick="deleteRecord()">삭제</button>
      <button onclick="closeModal()">취소</button>
      <button class="save" onclick="saveRecord()">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var AS_KEY    = 'daham_as_v1';
var SCHED_KEY = 'daham_schedule_v1';

var records      = [];
var schedProjects= [];
var currentFilter= 'all';
var editingId    = null;

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function pad(n){ return n<10?'0'+n:String(n); }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function fmtDate(ds){
  if(!ds) return '';
  var p=ds.split('-');
  return p[0]+'년 '+parseInt(p[1])+'월 '+parseInt(p[2])+'일';
}
function daysDiff(from, to){
  var a=new Date(from+'T00:00:00'), b=new Date(to+'T00:00:00');
  return Math.round((b-a)/86400000);
}

function load(){
  try{ records=JSON.parse(localStorage.getItem(AS_KEY)||'[]'); }catch(e){ records=[]; }
  try{ schedProjects=JSON.parse(localStorage.getItem(SCHED_KEY)||'[]'); }catch(e){ schedProjects=[]; }
}
function save(){
  localStorage.setItem(AS_KEY, JSON.stringify(records));
}

function populateSchedSel(){
  var sel=document.getElementById('m-proj');
  sel.innerHTML='<option value="">-- 현장 선택 --</option>';
  schedProjects.forEach(function(p){
    var name=(p.info&&(p.info.name||p.info.addr))||'현장명 미입력';
    sel.innerHTML+='<option value="'+esc(name)+'">'+esc(name)+'</option>';
  });
}

function setFilter(f){
  currentFilter=f;
  ['all','pending','doing','done'].forEach(function(k){
    document.getElementById('stat-'+k).classList.toggle('active', k===f);
  });
  renderList();
}

function updateStats(){
  var cnt={all:records.length, pending:0, doing:0, done:0};
  records.forEach(function(r){ if(cnt[r.status]!==undefined) cnt[r.status]++; });
  document.getElementById('cnt-all').textContent    = cnt.all;
  document.getElementById('cnt-pending').textContent= cnt.pending;
  document.getElementById('cnt-doing').textContent  = cnt.doing;
  document.getElementById('cnt-done').textContent   = cnt.done;
}

function statusLabel(s){
  if(s==='pending') return '<span class="status-badge badge-pending">접수</span>';
  if(s==='doing')   return '<span class="status-badge badge-doing">처리중</span>';
  if(s==='done')    return '<span class="status-badge badge-done">완료</span>';
  return '';
}

function renderList(){
  var q=(document.getElementById('search').value||'').trim().toLowerCase();
  var list=records.filter(function(r){
    if(currentFilter!=='all'&&r.status!==currentFilter) return false;
    if(q&&(r.proj||'').toLowerCase().indexOf(q)<0&&(r.content||'').toLowerCase().indexOf(q)<0) return false;
    return true;
  });
  // 정렬: 접수 → 처리중 → 완료, 같은 상태면 날짜 내림차순
  var order={pending:0, doing:1, done:2};
  list.sort(function(a,b){
    var os=order[a.status]-order[b.status];
    if(os!==0) return os;
    return (b.reportDate||'') > (a.reportDate||'') ? 1 : -1;
  });

  updateStats();

  var el=document.getElementById('as-list');
  if(!list.length){
    el.innerHTML='<div class="empty">'+
      (q||currentFilter!=='all' ? '조건에 맞는 A/S 내역이 없습니다.' : 'A/S 접수 내역이 없습니다.<br>상단 "+ 새 A/S 접수" 버튼으로 등록하세요.')+
      '</div>';
    return;
  }

  var html='';
  var today=todayStr();
  list.forEach(function(r){
    var elapsed = r.reportDate ? daysDiff(r.reportDate, today) : 0;
    var elapsedStr = r.status!=='done' && elapsed>0 ? '<span style="color:var(--s-pending);font-size:10px;font-weight:700"> ('+elapsed+'일 경과)</span>' : '';
    var resolveHtml='';
    if(r.status==='done'&&r.resolveNote){
      resolveHtml='<div class="as-resolve">✓ '+esc(r.resolveNote)+(r.resolveDate?' · '+fmtDate(r.resolveDate):'')+'</div>';
    }
    var clientHtml=r.client||r.tel ? '<div class="as-client">'+esc(r.client||'')+(r.tel?' &nbsp;'+esc(r.tel):'')+'</div>' : '';

    var actions='';
    if(r.status==='pending'){
      actions+='<button class="act-btn blue" onclick="quickStatus(\''+r.id+'\',\'doing\')">처리중</button>';
      actions+='<button class="act-btn green" onclick="quickStatus(\''+r.id+'\',\'done\')">완료</button>';
    } else if(r.status==='doing'){
      actions+='<button class="act-btn green" onclick="quickStatus(\''+r.id+'\',\'done\')">완료</button>';
    } else {
      actions+='<button class="act-btn" onclick="quickStatus(\''+r.id+'\',\'pending\')">재접수</button>';
    }
    actions+='<button class="act-btn" onclick="openModal(\''+r.id+'\')">수정</button>';

    html+='<div class="as-card status-'+r.status+'">'
      +'<div>'
        +'<div class="as-top">'+statusLabel(r.status)
          +'<span class="as-proj">'+esc(r.proj||'현장명 미입력')+'</span>'
          +'<span class="as-date">'+esc(fmtDate(r.reportDate))+elapsedStr+'</span>'
        +'</div>'
        +'<div class="as-content">'+esc(r.content||'')+'</div>'
        +resolveHtml+clientHtml
      +'</div>'
      +'<div class="as-actions">'+actions+'</div>'
      +'</div>';
  });
  el.innerHTML=html;
}

function quickStatus(id, status){
  var r=records.find(function(x){ return x.id===id; });
  if(!r) return;
  r.status=status;
  if(status==='done'&&!r.resolveDate) r.resolveDate=todayStr();
  save(); renderList(); showToast(status==='done'?'✓ 완료 처리했습니다':status==='doing'?'처리중으로 변경했습니다':'재접수 처리했습니다');
}

function onStatusChange(){
  var s=document.getElementById('m-status').value;
  document.getElementById('resolve-fields').style.display = (s==='done'||s==='doing') ? 'block' : 'none';
}

function openModal(id){
  editingId = id||null;
  var m=id ? records.find(function(x){ return x.id===id; }) : null;
  document.getElementById('modal-title').textContent = m ? 'A/S 수정' : '새 A/S 접수';
  document.getElementById('btn-del').style.display   = m ? 'inline-flex' : 'none';

  document.getElementById('m-proj').value       = m ? (m.proj||'') : '';
  document.getElementById('m-proj-text').value  = '';
  document.getElementById('m-client').value     = m ? (m.client||'') : '';
  document.getElementById('m-tel').value        = m ? (m.tel||'') : '';
  document.getElementById('m-report-date').value= m ? (m.reportDate||todayStr()) : todayStr();
  document.getElementById('m-status').value     = m ? (m.status||'pending') : 'pending';
  document.getElementById('m-content').value    = m ? (m.content||'') : '';
  document.getElementById('m-resolve-date').value= m ? (m.resolveDate||'') : '';
  document.getElementById('m-resolve-note').value= m ? (m.resolveNote||'') : '';
  onStatusChange();
  document.getElementById('modal-bg').style.display='flex';
}

function closeModal(){ document.getElementById('modal-bg').style.display='none'; editingId=null; }
function onBgClick(e){ if(e.target===document.getElementById('modal-bg')) closeModal(); }

function saveRecord(){
  var projSel  = document.getElementById('m-proj').value.trim();
  var projText = document.getElementById('m-proj-text').value.trim();
  var proj     = projSel || projText || '현장명 미입력';
  var client   = document.getElementById('m-client').value.trim();
  var tel      = document.getElementById('m-tel').value.trim();
  var rdate    = document.getElementById('m-report-date').value;
  var status   = document.getElementById('m-status').value;
  var content  = document.getElementById('m-content').value.trim();
  var rsolDate = document.getElementById('m-resolve-date').value;
  var rsolNote = document.getElementById('m-resolve-note').value.trim();

  if(!content){ showToast('하자 내용을 입력해주세요'); return; }

  if(editingId){
    var r=records.find(function(x){ return x.id===editingId; });
    if(r){ r.proj=proj; r.client=client; r.tel=tel; r.reportDate=rdate;
           r.status=status; r.content=content; r.resolveDate=rsolDate; r.resolveNote=rsolNote; }
  } else {
    records.push({id:uid(),proj:proj,client:client,tel:tel,
      reportDate:rdate,status:status,content:content,
      resolveDate:rsolDate,resolveNote:rsolNote,createdAt:new Date().toISOString()});
  }
  save(); closeModal(); renderList(); showToast('✓ 저장했습니다');
}

function deleteRecord(){
  if(!editingId) return;
  dahamConfirm('이 A/S 내역을 삭제할까요?', function() {
    records=records.filter(function(x){ return x.id!==editingId; });
    save(); closeModal(); renderList(); showToast('삭제했습니다');
  });
}

function showToast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(function(){ t.classList.remove('show'); },2000); }

load();
populateSchedSel();
renderList();
</script>
<script src="auth.js"></script>

<script>
(function(){
  const KEY='daham_workflow_v1';
  const now=()=>new Date().toISOString();
  const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{"projects":{}}')}catch(e){return {projects:{}}}};
  const save=d=>localStorage.setItem(KEY,JSON.stringify(d));
  const pid=()=>localStorage.getItem('daham_current_project')||new URLSearchParams(location.search).get('project')||'default';
  window.DAHAM_WORKFLOW={
    getProject(){const d=load(), id=pid(); return (d.projects[id] ||= {id,updatedAt:now(),estimateItems:[],scheduleItems:[],orderItems:[],alerts:[],settlement:{},completion:{},asItems:[]})},
    update(mut){const d=load(),id=pid(); const p=(d.projects[id] ||= {id,estimateItems:[],scheduleItems:[],orderItems:[],alerts:[],settlement:{},completion:{},asItems:[]}); mut(p); p.updatedAt=now(); save(d); return p},
    syncEstimate(items){return this.update(p=>{p.estimateItems=items||[]})},
    syncSchedule(items){return this.update(p=>{p.scheduleItems=items||[]})},
    syncOrders(items){return this.update(p=>{p.orderItems=items||[]})},
    key:KEY
  };
})();
</script>
