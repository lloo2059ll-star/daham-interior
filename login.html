<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAHAM — 로그인</title>
<style>
:root{
  --navy:#001c43;
  --navy2:#03234e;
  --ink:#071f45;
  --muted:#9aa6bc;
  --line:#d7ddea;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;background:#fff;color:var(--ink)}
body{min-height:100vh;overflow-x:hidden}
.login-shell{min-height:100vh;display:grid;grid-template-columns:55.2% 44.8%;background:#fff}
.visual{
  min-height:100vh;
  background-image:url('login-bg.png');
  background-size:cover;
  background-position:center center;
  background-repeat:no-repeat;
}
.panel{min-height:100vh;position:relative;display:flex;flex-direction:column;background:#fff}
.brand-top{position:absolute;top:40px;left:0;right:0;text-align:center;font-size:13px;font-weight:700;letter-spacing:.33em;color:#0b2348;white-space:nowrap}
.login-center{width:min(470px,calc(100% - 72px));margin:auto;padding:108px 0 138px}
.welcome{font-size:18px;color:#98a4ba;margin:0 0 6px;text-align:center;font-weight:400}
h1{font-size:48px;line-height:1.05;letter-spacing:-.04em;margin:0 0 28px;text-align:center;color:#001d45;font-weight:800}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f1f4f8;border-radius:9px;padding:4px;margin-bottom:26px}.tab{height:42px;border:0;border-radius:7px;background:transparent;color:#7d899e;font-weight:700;cursor:pointer}.tab.active{background:#fff;color:#071f45;box-shadow:0 2px 8px #001c4312}.auth-form[hidden]{display:none}.signup-note{font-size:12px;line-height:1.55;color:#7d899e;margin:-8px 0 18px}.msg.ok{color:#147a4b;background:#effaf4;border-radius:8px;padding:10px}.btn:disabled{opacity:.6;cursor:wait}
.field{margin-bottom:25px}
.field label{display:block;font-size:14px;font-weight:700;color:#142c50;margin:0 0 10px 2px}
.input-wrap{height:60px;border:1px solid #c8cfdd;border-radius:7px;display:flex;align-items:center;background:#fff;transition:.18s ease}
.input-wrap:focus-within{border-color:#7e8da8;box-shadow:0 0 0 3px rgba(10,42,83,.05)}
.icon{width:22px;height:22px;margin-left:20px;flex:0 0 auto;color:#9aa7bd}
.input-wrap input{min-width:0;flex:1;border:0;outline:0;height:100%;padding:0 16px;font-size:15px;color:#132946;background:transparent;font-family:inherit}
.input-wrap input::placeholder{color:#b4bdcd}
.eye{border:0;background:transparent;width:56px;height:100%;display:grid;place-items:center;cursor:pointer;color:#92a0b8;padding:0}
.eye svg{width:22px;height:22px}
.btn{width:100%;height:60px;border:0;border-radius:6px;background:linear-gradient(100deg,#001d43,#032854);color:#fff;font-size:17px;font-weight:700;letter-spacing:.08em;cursor:pointer;margin-top:5px;box-shadow:0 7px 16px rgba(0,28,67,.08)}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translateY(1px)}
.msg{min-height:21px;margin-top:10px;text-align:center;font-size:13px;color:#c62828}
.help{display:flex;align-items:center;gap:14px;margin-top:13px;color:#8793aa;font-size:14px;justify-content:center;white-space:nowrap}
.help:before,.help:after{content:"";height:1px;background:#d5dbe6;flex:1}
.help-icon{width:19px;height:19px;flex:0 0 auto}
.footer{position:absolute;left:0;right:0;bottom:0;height:84px;border-top:1px solid #e4e8ef;display:grid;place-items:center;color:#98a3b7;font-size:12px;letter-spacing:.25em;white-space:nowrap}
@media(max-width:980px){
  .login-shell{grid-template-columns:1fr}
  .visual{display:none}
  .panel{min-height:100vh}
  .login-center{width:min(470px,calc(100% - 40px));padding-top:120px}
  .brand-top{top:32px;font-size:11px}
}
@media(max-width:520px){
  .login-center{width:calc(100% - 32px);padding:105px 0 110px}
  h1{font-size:39px;margin-bottom:38px}
  .welcome{font-size:16px}
  .input-wrap,.btn{height:56px}
  .help{font-size:12px;gap:10px}
  .footer{height:66px;font-size:10px}
}
</style>
<link rel="stylesheet" href="operations-ui.css">
</head>
<body class="operations-ui operations-auth">
<div class="login-shell">
  <section class="visual" aria-label="DAHAM INTERIOR COMPANY"></section>
  <main class="panel">
    <div class="brand-top">DAHAM INTERIOR COMPANY</div>
    <div class="login-center">
      <p class="welcome">Welcome Back</p>
      <h1>로그인</h1>
      <div class="tabs" role="tablist" aria-label="계정 메뉴"><button class="tab active" id="loginTab" type="button">로그인</button><button class="tab" id="signupTab" type="button">직원 회원가입</button></div>
      <form id="loginForm" class="auth-form" novalidate>
        <div class="field">
          <label for="username">아이디</label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 21a7.5 7.5 0 0 1 15 0"></path></svg>
            <input id="username" autocomplete="username" placeholder="이메일 아이디를 입력하세요" required autofocus>
          </div>
        </div>
        <div class="field">
          <label for="password">비밀번호</label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
            <input id="password" type="password" autocomplete="current-password" placeholder="비밀번호를 입력하세요" required>
            <button class="eye" id="togglePassword" type="button" aria-label="비밀번호 보기">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.7"></circle></svg>
            </button>
          </div>
        </div>
        <button class="btn" type="submit">로그인</button>
        <div class="msg" id="msg"></div>
      </form>
      <form id="signupForm" class="auth-form" novalidate hidden>
        <p class="signup-note">가입 후 대표 또는 관리자의 승인이 완료되어야 내부 페이지에 로그인할 수 있습니다.</p>
        <div class="field"><label for="signupName">이름</label><div class="input-wrap"><input id="signupName" autocomplete="name" placeholder="이름을 입력하세요" required></div></div>
        <div class="field"><label for="signupEmail">이메일</label><div class="input-wrap"><input id="signupEmail" type="email" autocomplete="email" placeholder="name@example.com" required></div></div>
        <div class="field"><label for="signupPassword">비밀번호</label><div class="input-wrap"><input id="signupPassword" type="password" autocomplete="new-password" placeholder="8자 이상" required></div></div>
        <div class="field"><label for="signupPasswordConfirm">비밀번호 확인</label><div class="input-wrap"><input id="signupPasswordConfirm" type="password" autocomplete="new-password" placeholder="비밀번호를 다시 입력하세요" required></div></div>
        <button class="btn" id="signupSubmit" type="submit">가입 신청</button>
        <div class="msg" id="signupMsg" aria-live="polite"></div>
      </form>
      <div class="help">
        <svg class="help-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 13v-2a8 8 0 0 1 16 0v2"></path><path d="M4 13h2.5v5H5a1 1 0 0 1-1-1v-4Zm16 0h-2.5v5H19a1 1 0 0 0 1-1v-4Z"></path><path d="M17.5 18c-.8 2-2.6 3-5.5 3"></path></svg>
        <span>계정 문의는 관리자에게 연락하세요</span>
      </div>
    </div>
    <footer class="footer">© DAHAM INTERIOR COMPANY</footer>
  </main>
</div>
<script src="auth.js"></script>
<script>
const form=document.getElementById('loginForm');
const username=document.getElementById('username');
const password=document.getElementById('password');
const msg=document.getElementById('msg');
const togglePassword=document.getElementById('togglePassword');

const loginTab=document.getElementById('loginTab');
const signupTab=document.getElementById('signupTab');
const signupForm=document.getElementById('signupForm');
function selectTab(name){
  const signup=name==='signup';
  form.hidden=signup; signupForm.hidden=!signup;
  loginTab.classList.toggle('active',!signup); signupTab.classList.toggle('active',signup);
  document.querySelector('h1').textContent=signup?'직원 회원가입':'로그인';
  if(signup) location.hash='signup'; else history.replaceState(null,'',location.pathname);
}
loginTab.onclick=()=>selectTab('login');
signupTab.onclick=()=>selectTab('signup');
if(location.hash==='#signup') selectTab('signup');

togglePassword.addEventListener('click',()=>{
  const show=password.type==='password';
  password.type=show?'text':'password';
  togglePassword.setAttribute('aria-label',show?'비밀번호 숨기기':'비밀번호 보기');
});

form.addEventListener('submit',async(e)=>{
  e.preventDefault();
  msg.textContent='';
  try{
    await DAHAM_AUTH.login(username.value,password.value);
    location.href='index.html';
  }catch(err){
    msg.textContent=err && err.message ? err.message : '로그인에 실패했습니다.';
  }
});
signupForm.addEventListener('submit',async(e)=>{
  e.preventDefault();
  const signupMsg=document.getElementById('signupMsg');
  const signupSubmit=document.getElementById('signupSubmit');
  const passwordValue=document.getElementById('signupPassword').value;
  signupMsg.className='msg'; signupMsg.textContent='';
  if(passwordValue!==document.getElementById('signupPasswordConfirm').value){signupMsg.textContent='비밀번호가 서로 다릅니다.';return}
  signupSubmit.disabled=true;
  try{
    const result=await DAHAM_AUTH.createAccount({name:document.getElementById('signupName').value,email:document.getElementById('signupEmail').value,password:passwordValue});
    signupMsg.className='msg ok';
    signupMsg.textContent=result.message||'가입이 완료되었습니다. 관리자 승인 대기 중입니다.';
    signupForm.reset();
  }catch(err){signupMsg.textContent=err?.message||'가입 신청에 실패했습니다.'}
  finally{signupSubmit.disabled=false}
});
</script>
</body>
</html>
