name: Website final check
on:
  push:
    branches:
      - feature/website-final-pixel-match
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Website feature tests
        run: node --test tests/website-public-domain.test.js tests/website-admin-domain.test.js tests/website-db-security.test.js tests/website-ui.test.js tests/website-admin-ui.test.js tests/security-regression.test.js
      - name: Regression suite except known stale UI hash test
        run: node --test $(find tests -name '*.test.js' ! -name 'ui-unification.test.js' -print)
