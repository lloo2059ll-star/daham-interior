name: Website pixel check
on:
  push:
    branches:
      - feature/website-pixel-match-v1
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/website-ui.test.js
