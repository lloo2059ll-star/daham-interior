<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAHAM — 상가 견적 기본단가</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="auth.js"></script><script src="price-management.js"></script><script src="commercial-estimate-domain.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#1d2939;font:13px Pretendard,-apple-system,sans-serif}.head{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid #e3e7ef;padding:17px 24px;display:flex;justify-content:space-between;align-items:center}.head h1{margin:0;font-size:22px}.btn{border:1px solid #d7dce7;background:#fff;border-radius:8px;padding:9px 14px;font-weight:800;cursor:pointer}.btn.primary{background:#6238df;color:#fff;border-color:#6238df}.wrap{max-width:1200px;margin:18px auto;padding:0 15px}.category{background:#fff;border:1px solid #e0e4ed;border-radius:10px;margin-bottom:10px;overflow:hidden}.category h2{font-size:15px;margin:0;padding:13px 16px;background:#fafbfc}.row{display:grid;grid-template-columns:1fr 75px 150px 150px;gap:10px;align-items:center;padding:8px 16px;border-top:1px solid #edf0f5}.row input{border:1px solid #d8dde7;border-radius:6px;padding:8px;text-align:right;width:100%}.unit{color:#7d8698;text-align:center}.toast{position:fixed;right:20px;bottom:20px;background:#172036;color:#fff;padding:12px 16px;border-radius:8px;display:none}@media(max-width:700px){.row{grid-template-columns:1fr 60px}.row input{grid-column:auto}.head{align-items:flex-start;gap:10px}}</style></head><body><header class="head"><div><h1>상가 견적 기본단가</h1><small>새로 작성하는 상가 견적서에 적용됩니다.</small></div><div><button class="btn" onclick="location.href='estimate-commercial.html'">상가 견적서</button> <button id="save" class="btn primary">저장</button></div></header><main id="catalog" data-settings-key="commercialEstimateDefaults" class="wrap"></main><div id="toast" class="toast"></div><script>
const currentSettings=JSON.parse(localStorage.getItem('daham_settings_v1')||localStorage.getItem('daham_settings')||'{}'),catalog=DAHAM_PRICES.loadCommercialDefaults(DAHAM_COMMERCIAL_ESTIMATE.CATALOG,currentSettings),host=document.getElementById('catalog');host.innerHTML=catalog.map(c=>`<section class="category"><h2>${c.name}</h2>${c.items.map(i=>`<div class="row" data-id="${i.id}"><strong>${i.name}</strong><span class="unit">${i.unit}</span><input class="labor" inputmode="numeric" aria-label="${i.name} 인건비" value="${Number(i.laborUnit||0).toLocaleString('ko-KR')}"><input class="material" inputmode="numeric" aria-label="${i.name} 자재비" value="${Number(i.materialUnit||0).toLocaleString('ko-KR')}"></div>`).join('')}</section>`).join('');function toast(m){const e=document.getElementById('toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}async function writeCommercialSettings(next){const cfg=DAHAM_AUTH.getSupabaseConfig(),token=DAHAM_AUTH.getAccessToken(),client=window.supabase.createClient(cfg.url,cfg.key,{global:{headers:{Authorization:'Bearer '+token}},auth:{persistSession:false,autoRefreshToken:false}});const result=await client.from('sync_data').upsert({key:'daham_settings_v1',value:JSON.stringify(next),updated_at:new Date().toISOString()});if(result.error)throw result.error}document.getElementById('save').onclick=async()=>{const user=DAHAM_AUTH.currentUser();if(!DAHAM_PRICES.canManage(user)){toast('대표 또는 관리자만 저장할 수 있습니다.');return}const changes={};document.querySelectorAll('[data-id]').forEach(r=>changes[r.dataset.id]={laborUnit:r.querySelector('.labor').value,materialUnit:r.querySelector('.material').value});try{const next=DAHAM_PRICES.saveCommercialDefaults({catalog:DAHAM_COMMERCIAL_ESTIMATE.CATALOG,currentSettings,changes});await writeCommercialSettings(next);localStorage.setItem('daham_settings_v1',JSON.stringify(next));toast('상가 기본단가를 저장했습니다.')}catch(e){toast(e.message)}};
</script></body></html>
