<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>다함인테리어 — 현장 사진첩</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E65100">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="다함">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --o1:#E65100;--o2:#FF6D00;--o3:#FF8F00;
  --ink:#1a1a1a;--mid:#555;--dim:#999;
  --line:#eee;--bg:#f5f4f2;--white:#fff;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}

.app-header{background:var(--white);border-bottom:1px solid var(--line);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.app-header-left{display:flex;align-items:center;gap:10px}
.back-btn{background:none;border:none;font-size:20px;cursor:pointer;padding:4px;color:var(--ink);display:flex;align-items:center}
.header-title{font-size:16px;font-weight:800;letter-spacing:-.01em}
.logo{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--o1);letter-spacing:.1em}

main{max-width:860px;margin:0 auto;padding:28px 16px 100px;flex:1;width:100%}

/* ── 앨범 그리드 ── */
.album-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.album-card{background:var(--white);border-radius:14px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06);border:1.5px solid transparent;transition:all .2s;cursor:pointer;position:relative}
.album-card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.12);border-color:rgba(230,81,0,.2)}
.album-thumb-wrap{width:100%;aspect-ratio:4/3;overflow:hidden;background:#f0ede9;display:flex;align-items:center;justify-content:center;font-size:40px;color:#ccc}
.album-thumb-wrap img{width:100%;height:100%;object-fit:cover}
.album-thumb-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;width:100%;height:100%}
.album-thumb-grid img{width:100%;height:100%;object-fit:cover}
.album-thumb-grid .thumb-more{background:#1a1a1a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.album-info{padding:14px 14px 16px}
.album-name{font-size:14px;font-weight:800;margin-bottom:4px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.album-addr{font-size:11px;color:var(--dim);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.album-meta{display:flex;align-items:center;justify-content:space-between}
.album-count{font-size:12px;font-weight:700;color:var(--o1)}
.album-date{font-size:10px;color:var(--dim)}
.album-bar{height:3px;background:linear-gradient(90deg,var(--o1),var(--o3));position:absolute;top:0;left:0;right:0;opacity:0;transition:opacity .2s}
.album-card:hover .album-bar{opacity:1}
.album-del-btn{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.45);border:none;color:#fff;font-size:14px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:10}
.album-card:hover .album-del-btn{display:flex}
.album-del-btn:hover{background:rgba(198,40,40,.85)}
.empty-album{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--dim);font-size:14px;line-height:2}

/* ── 사진 뷰 ── */
.photo-view{display:none}
.photo-view.active{display:block}
.proj-info-bar{background:var(--white);border-radius:14px;padding:18px 18px 16px;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.proj-info-name{font-size:18px;font-weight:900;letter-spacing:-.02em;margin-bottom:4px}
.proj-info-addr{font-size:12px;color:var(--dim)}
.proj-info-stats{display:flex;gap:20px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.stat-item{text-align:center}
.stat-val{font-size:18px;font-weight:800;color:var(--o1)}
.stat-lbl{font-size:10px;color:var(--dim);margin-top:2px}

/* ── 업로드 바 ── */
.upload-bar{display:flex;gap:10px;margin-bottom:20px}
.upload-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:12px;border:none;font-family:var(--sans);font-size:14px;font-weight:700;cursor:pointer;transition:all .15s}
.upload-btn.camera{background:var(--o1);color:#fff}
.upload-btn.camera:hover{background:#BF360C}
.upload-btn.gallery{background:var(--white);color:var(--ink);border:2px solid var(--line)}
.upload-btn.gallery:hover{border-color:var(--o1);color:var(--o1)}
input[type=file]{display:none}

/* ── 미디어 그리드 ── */
.photo-grid{columns:2;gap:8px}
@media(min-width:500px){.photo-grid{columns:3}}
@media(min-width:700px){.photo-grid{columns:4}}
.photo-item{break-inside:avoid;margin-bottom:8px;position:relative;border-radius:10px;overflow:hidden;cursor:pointer;background:#e8e4e0}
.photo-item img{width:100%;display:block;border-radius:10px;transition:transform .2s}
.photo-item:hover img{transform:scale(1.03)}
.photo-caption-bar{position:absolute;bottom:0;left:0;right:0;padding:8px 10px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:11px;line-height:1.4}
.photo-date-badge{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.45);color:#fff;font-size:9px;padding:2px 6px;border-radius:4px}
.photo-del-btn{position:absolute;top:6px;left:6px;background:rgba(198,40,40,.85);color:#fff;border:none;border-radius:4px;width:26px;height:26px;font-size:14px;cursor:pointer;display:none;align-items:center;justify-content:center}
.photo-item:hover .photo-del-btn{display:flex}
/* 영상 배지 */
.video-badge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.video-play{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff}
.video-len{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.55);color:#fff;font-size:9px;padding:2px 6px;border-radius:4px;font-weight:700}
.no-photo{text-align:center;padding:60px 20px;color:var(--dim);font-size:14px;line-height:2}

/* ── 라이트박스 ── */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center}
.lightbox.open{display:flex}
.lightbox-img{max-width:92vw;max-height:74vh;object-fit:contain;border-radius:8px}
.lightbox-video{max-width:92vw;max-height:74vh;border-radius:8px;background:#000;outline:none}
.lightbox-caption{color:#fff;font-size:13px;margin-top:14px;text-align:center;max-width:420px;padding:0 20px;opacity:.85}
.lightbox-date{color:rgba(255,255,255,.45);font-size:10px;margin-top:4px}
.lightbox-close{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:20px;width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);border:none;color:#fff;font-size:24px;width:44px;height:44px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lightbox-nav.prev{left:10px}
.lightbox-nav.next{right:10px}
.lightbox-actions{position:absolute;bottom:18px;display:flex;gap:10px}
.lightbox-action-btn{background:rgba(255,255,255,.15);border:none;color:#fff;font-size:12px;font-weight:700;padding:8px 16px;border-radius:20px;cursor:pointer;font-family:var(--sans)}
.lightbox-action-btn:hover{background:rgba(255,255,255,.28)}
.lightbox-action-btn.danger{background:rgba(198,40,40,.7)}
.lightbox-action-btn.danger:hover{background:rgba(198,40,40,.9)}
.caption-edit-wrap{background:rgba(0,0,0,.65);position:absolute;bottom:68px;left:20px;right:20px;border-radius:10px;padding:12px;display:none}
.caption-edit-wrap.open{display:block}
.caption-input{width:100%;background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.4);color:#fff;font-size:14px;font-family:var(--sans);padding:4px 0;outline:none}
.caption-save-btn{margin-top:8px;background:var(--o1);color:#fff;border:none;border-radius:6px;padding:6px 16px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--sans)}

/* ── 토스트 ── */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 22px;border-radius:24px;font-size:13px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;z-index:10000}
.toast.show{opacity:1}

/* ── 모바일 NAV ── */
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:58px;background:var(--white);border-top:1px solid var(--line);z-index:200}
.mobile-nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--dim)}
.mobile-nav a.active{color:var(--o1)}
.mn-icon{font-size:18px;line-height:1}
.mn-label{font-size:8px;font-weight:600;letter-spacing:.02em}

@media(max-width:640px){
  .album-grid{gap:10px}
  main{padding:16px 12px 80px}
  .mobile-nav{display:flex}
  body{padding-bottom:58px}
  .lightbox-nav{display:none}
}
</style>

<body>

<header class="app-header">
  <div class="app-header-left">
    <button class="back-btn" id="back-btn">←</button>
    <div class="header-title" id="header-title">현장 사진첩</div>
  </div>
  <span class="logo">DAHAM</span>
</header>

<main>
  <div id="album-view">
    <div class="album-grid" id="album-grid"></div>
  </div>

  <div class="photo-view" id="photo-view">
    <div class="proj-info-bar" id="proj-info-bar"></div>
    <div class="upload-bar">
      <button class="upload-btn camera" onclick="triggerCamera()">📷 촬영</button>
      <button class="upload-btn gallery" onclick="triggerGallery()">🖼 갤러리 / 영상</button>
    </div>
    <input type="file" id="camera-input" accept="image/*,video/*" capture="environment">
    <input type="file" id="gallery-input" accept="image/*,video/*" multiple>
    <div class="photo-grid" id="photo-grid"></div>
  </div>
</main>

<!-- 라이트박스 -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <button class="lightbox-nav prev" onclick="lightboxNav(-1)">‹</button>
  <img class="lightbox-img" id="lightbox-img" src="" alt="" style="display:none">
  <video class="lightbox-video" id="lightbox-video" controls playsinline style="display:none"></video>
  <div class="lightbox-caption" id="lightbox-caption"></div>
  <div class="lightbox-date" id="lightbox-date"></div>
  <button class="lightbox-nav next" onclick="lightboxNav(1)">›</button>
  <div class="caption-edit-wrap" id="caption-edit-wrap">
    <input class="caption-input" id="caption-input" type="text" placeholder="설명 입력...">
    <button class="caption-save-btn" onclick="saveCaption()">저장</button>
  </div>
  <div class="lightbox-actions">
    <button class="lightbox-action-btn" onclick="downloadCurrent()">⬇ 저장</button>
    <button class="lightbox-action-btn" onclick="toggleCaptionEdit()">✏ 설명</button>
    <button class="lightbox-action-btn danger" onclick="deleteCurrentPhoto()">🗑 삭제</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<nav class="mobile-nav">
  <a href="index.html"><span class="mn-icon">🏠</span><span class="mn-label">홈</span></a>
  <a href="schedule.html"><span class="mn-icon">📅</span><span class="mn-label">일정</span></a>
  <a href="consult.html"><span class="mn-icon">💬</span><span class="mn-label">상담</span></a>
  <a href="contacts.html"><span class="mn-icon">👷</span><span class="mn-label">거래처</span></a>
  <a href="as.html"><span class="mn-icon">🔧</span><span class="mn-label">A/S</span></a>
  <a href="photos.html" class="active"><span class="mn-icon">📸</span><span class="mn-label">사진첩</span></a>
</nav>

<script>
var PHOTO_KEY    = 'daham_photos_v1';
var SCHED_KEY    = 'daham_schedule_v1';
var ESTIMATE_KEY = 'daham_detail_v2';
var HIDDEN_KEY   = 'daham_hidden_albums_v1';
var VDB_NAME  = 'daham_vdb';
var VDB_STORE = 'videos';

var currentProjId  = null;
var lightboxIdx    = 0;
var lightboxPhotos = [];
var vDB = null;
var _currentVideoUrl = null;
var _currentImageUrl = null;

/* ══ IndexedDB (영상 + 이미지 blob 저장) ══ */
var IDB_IMG_STORE = 'images';

function openPhotoDB() {
  return new Promise(function(resolve) {
    if (vDB) { resolve(); return; }
    var req = indexedDB.open(VDB_NAME, 2); // v2: images 스토어 추가
    req.onupgradeneeded = function(e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains(VDB_STORE))   db.createObjectStore(VDB_STORE);
      if (!db.objectStoreNames.contains(IDB_IMG_STORE)) db.createObjectStore(IDB_IMG_STORE);
    };
    req.onsuccess = function(e) { vDB = e.target.result; resolve(); };
    req.onerror   = function()  { resolve(); };
  });
}
function openVideoDB() { return openPhotoDB(); } // 하위호환

function saveVideoBlob(id, blob) {
  if (!vDB) return Promise.resolve();
  return new Promise(function(resolve, reject) {
    var tx = vDB.transaction(VDB_STORE, 'readwrite');
    tx.objectStore(VDB_STORE).put(blob, id);
    tx.oncomplete = resolve; tx.onerror = reject;
  });
}
function loadVideoBlob(id) {
  return new Promise(function(resolve) {
    if (!vDB) { resolve(null); return; }
    var tx  = vDB.transaction(VDB_STORE, 'readonly');
    var req = tx.objectStore(VDB_STORE).get(id);
    req.onsuccess = function() { resolve(req.result || null); };
    req.onerror   = function() { resolve(null); };
  });
}
function deleteVideoBlob(id) {
  if (!vDB) return;
  vDB.transaction(VDB_STORE, 'readwrite').objectStore(VDB_STORE).delete(id);
}

function saveImageBlob(id, blob) {
  if (!vDB) return Promise.resolve();
  return new Promise(function(resolve, reject) {
    var tx = vDB.transaction(IDB_IMG_STORE, 'readwrite');
    tx.objectStore(IDB_IMG_STORE).put(blob, id);
    tx.oncomplete = resolve; tx.onerror = reject;
  });
}
function loadImageBlob(id) {
  return new Promise(function(resolve) {
    if (!vDB) { resolve(null); return; }
    var tx  = vDB.transaction(IDB_IMG_STORE, 'readonly');
    var req = tx.objectStore(IDB_IMG_STORE).get(id);
    req.onsuccess = function() { resolve(req.result || null); };
    req.onerror   = function() { resolve(null); };
  });
}
function deleteImageBlob(id) {
  if (!vDB) return;
  vDB.transaction(IDB_IMG_STORE, 'readwrite').objectStore(IDB_IMG_STORE).delete(id);
}

/* ══ 로컬 데이터 ══ */
function loadPhotos() {
  try { return JSON.parse(localStorage.getItem(PHOTO_KEY) || '[]'); } catch(e) { return []; }
}
function savePhotos(arr) {
  localStorage.setItem(PHOTO_KEY, JSON.stringify(arr));
}
function loadSchedule() {
  try { return JSON.parse(localStorage.getItem(SCHED_KEY) || '[]'); } catch(e) { return []; }
}
function loadContractedProjects() {
  try {
    return JSON.parse(localStorage.getItem(ESTIMATE_KEY) || '[]').filter(function(p) {
      return (p.contracted || p.completed) && p.client && p.client['cl-name'];
    });
  } catch(e) { return []; }
}
function loadHiddenAlbums() {
  try { return JSON.parse(localStorage.getItem(HIDDEN_KEY) || '[]'); } catch(e) { return []; }
}
function saveHiddenAlbums(arr) {
  localStorage.setItem(HIDDEN_KEY, JSON.stringify(arr));
}

/* ══ 뷰 전환 ══ */
function showAlbumView() {
  currentProjId = null;
  document.getElementById('album-view').style.display = '';
  document.getElementById('photo-view').classList.remove('active');
  document.getElementById('header-title').textContent = '현장 사진첩';
  document.getElementById('back-btn').onclick = function() { location.href = 'index.html'; };
  renderAlbums();
}
function showPhotoView(projId) {
  currentProjId = projId;
  document.getElementById('album-view').style.display = 'none';
  document.getElementById('photo-view').classList.add('active');
  document.getElementById('back-btn').onclick = showAlbumView;
  renderPhotoView();
}

/* ══ 앨범 목록 렌더 ══ */
function renderAlbums() {
  var photos      = loadPhotos();
  var schedule    = loadSchedule();
  var contracted  = loadContractedProjects();
  var hidden      = loadHiddenAlbums();
  var grid        = document.getElementById('album-grid');

  var schedProjects = schedule.filter(function(p) {
    return p.info && p.info.name && hidden.indexOf(p.id) === -1;
  });
  var schedIds = schedProjects.map(function(p) { return p.id; });

  // 견적에서 계약완료된 현장 중 일정표에 없고 숨기지 않은 것만 추가
  var estProjects = contracted.filter(function(p) {
    return schedIds.indexOf(p.id) === -1 && hidden.indexOf(p.id) === -1;
  });

  var allIds = schedIds.concat(estProjects.map(function(p) { return p.id; }));
  var totalCount = schedProjects.length + estProjects.length;

  var html = '';

  schedProjects.forEach(function(p) {
    var pm = photos.filter(function(ph) { return ph.projId === p.id; });
    html += makeAlbumCard(p.id, (p.info&&p.info.name)||'', (p.info&&p.info.addr)||'', pm);
  });

  estProjects.forEach(function(p) {
    var pm = photos.filter(function(ph) { return ph.projId === p.id; });
    html += makeAlbumCard(p.id, p.client['cl-addr'] || p.client['cl-name'] || '', p.client['cl-addr'] || '', pm);
  });

  var etcPhotos = photos.filter(function(ph) {
    return ph.projId === 'etc' || (ph.projId !== 'all' && allIds.indexOf(ph.projId) === -1);
  });
  if (etcPhotos.length > 0) html += makeAlbumCard('etc', '기타', '현장 미지정', etcPhotos);

  if (totalCount === 0) {
    html += '<div class="empty-album" style="grid-column:1/-1;padding:20px 16px;font-size:12px">견적에서 계약완료 처리하거나<br>일정 관리에서 현장을 추가하면<br>현장별 앨범이 자동으로 생깁니다.</div>';
  }
  grid.innerHTML = html;
}

function makeAlbumCard(projId, name, addr, items) {
  var count  = items.length;
  var videos = items.filter(function(i){ return i.type === 'video'; }).length;
  var sorted = items.slice().sort(function(a,b){ return b.ts - a.ts; });
  var lastDate = sorted[0] ? sorted[0].date : '';

  var thumbHtml = '';
  if (count === 0) {
    thumbHtml = '<div class="album-thumb-wrap">📷</div>';
  } else if (count === 1) {
    thumbHtml = '<div class="album-thumb-wrap"><img src="' + sorted[0].thumb + '"></div>';
  } else if (count <= 3) {
    var imgs = sorted.slice(0, count).map(function(p) { return '<img src="' + p.thumb + '">'; }).join('');
    thumbHtml = '<div class="album-thumb-wrap"><div class="album-thumb-grid" style="grid-template-columns:repeat(' + count + ',1fr);grid-template-rows:1fr">' + imgs + '</div></div>';
  } else {
    var imgs3 = sorted.slice(0, 3).map(function(p) { return '<img src="' + p.thumb + '">'; }).join('');
    thumbHtml = '<div class="album-thumb-wrap"><div class="album-thumb-grid">' + imgs3 + '<div class="thumb-more">+' + (count-3) + '</div></div></div>';
  }

  var countLabel = '📸 ' + count + '개';
  if (videos > 0) countLabel += ' · 🎬 ' + videos;

  var delBtn = projId !== 'all'
    ? '<button class="album-del-btn" onclick="event.stopPropagation();deleteAlbum(\'' + projId + '\',\'' + esc(name) + '\')">✕</button>'
    : '';

  return '<div class="album-card" onclick="showPhotoView(\'' + projId + '\')">' +
    '<div class="album-bar"></div>' + delBtn + thumbHtml +
    '<div class="album-info">' +
      '<div class="album-name">' + esc(name) + '</div>' +
      '<div class="album-addr">' + esc(addr) + '</div>' +
      '<div class="album-meta"><span class="album-count">' + countLabel + '</span><span class="album-date">' + lastDate + '</span></div>' +
    '</div></div>';
}

/* ══ 앨범 삭제 ══ */
function deleteAlbum(projId, name) {
  var photos  = loadPhotos();
  var targets = photos.filter(function(p){ return p.projId === projId; });
  dahamConfirm('「' + name + '」 앨범을 삭제할까요?\n(사진·영상 ' + targets.length + '개 포함)\n이 작업은 되돌릴 수 없습니다.', function() {
    openPhotoDB().then(function() {
      targets.forEach(function(p){
        if (p.type === 'video') deleteVideoBlob(p.id);
        else deleteImageBlob(p.id);
      });
    });
    savePhotos(photos.filter(function(p){ return p.projId !== projId; }));
    var hidden = loadHiddenAlbums();
    if (hidden.indexOf(projId) === -1) hidden.push(projId);
    saveHiddenAlbums(hidden);
    renderAlbums();
    showToast('앨범이 삭제됐습니다');
  });
}

/* ══ 사진·영상 뷰 렌더 ══ */
function renderPhotoView() {
  var photos   = loadPhotos();
  var schedule = loadSchedule();
  var title = '', addr = '';
  if (currentProjId === 'all')      { title = '전체 사진·영상'; addr = '모든 현장'; }
  else if (currentProjId === 'etc') { title = '기타'; addr = '현장 미지정'; }
  else {
    var proj = schedule.find(function(p){ return p.id === currentProjId; });
    title = proj ? (proj.info.name || '현장') : '현장';
    addr  = proj ? (proj.info.addr || '') : '';
  }
  document.getElementById('header-title').textContent = title;

  var filtered = currentProjId === 'all'
    ? photos.slice()
    : photos.filter(function(p){ return p.projId === currentProjId; });
  filtered.sort(function(a,b){ return b.ts - a.ts; });
  lightboxPhotos = filtered;

  var videos = filtered.filter(function(p){ return p.type === 'video'; }).length;
  document.getElementById('proj-info-bar').innerHTML =
    '<div class="proj-info-name">' + esc(title) + '</div>' +
    '<div class="proj-info-addr">' + esc(addr) + '</div>' +
    '<div class="proj-info-stats">' +
      '<div class="stat-item"><div class="stat-val">' + filtered.length + '</div><div class="stat-lbl">전체</div></div>' +
      '<div class="stat-item"><div class="stat-val">' + (filtered.length - videos) + '</div><div class="stat-lbl">사진</div></div>' +
      '<div class="stat-item"><div class="stat-val">' + videos + '</div><div class="stat-lbl">영상</div></div>' +
    '</div>';

  var grid = document.getElementById('photo-grid');
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="no-photo">📷 사진·영상이 없습니다.<br>위 버튼으로 추가해보세요.</div>';
    return;
  }
  grid.innerHTML = filtered.map(function(item, idx) {
    var isVideo = item.type === 'video';
    var badge   = isVideo
      ? '<div class="video-badge"><div class="video-play">▶</div></div>' +
        (item.duration ? '<div class="video-len">' + fmtDuration(item.duration) + '</div>' : '')
      : '';
    var caption = item.caption ? '<div class="photo-caption-bar">' + esc(item.caption) + '</div>' : '';
    return '<div class="photo-item" onclick="openLightbox(' + idx + ')">' +
      '<img src="' + item.thumb + '" loading="lazy">' +
      badge +
      '<button class="photo-del-btn" onclick="event.stopPropagation();deleteItem(\'' + item.id + '\')">✕</button>' +
      '<div class="photo-date-badge">' + item.date + '</div>' +
      caption +
    '</div>';
  }).join('');
}

/* ══ 업로드 ══ */
function triggerCamera()  { var el = document.getElementById('camera-input');  el.value=''; el.click(); }
function triggerGallery() { var el = document.getElementById('gallery-input'); el.value=''; el.click(); }

document.getElementById('camera-input').addEventListener('change',  function(e){ handleFiles(e.target.files); });
document.getElementById('gallery-input').addEventListener('change', function(e){ handleFiles(e.target.files); });

function handleFiles(files) {
  if (!files || !files.length) return;
  var arr    = Array.from(files);
  var photos = loadPhotos();
  var today  = todayStr();
  var done   = 0;
  showToast('처리 중... (0/' + arr.length + ')');

  arr.forEach(function(file) {
    var isVideo = file.type.startsWith('video/');
    var id = Date.now() + '_' + Math.random().toString(36).slice(2,6);

    if (isVideo) {
      // 영상: IndexedDB에 blob 저장, 썸네일은 첫 프레임 캡처
      generateVideoThumb(file, function(thumb, duration) {
        openVideoDB().then(function() {
          return saveVideoBlob(id, file);
        }).then(function() {
          photos.push({
            id: id, projId: currentProjId === 'all' ? 'etc' : currentProjId,
            type: 'video', thumb: thumb || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="4" height="3"><rect fill="%23333" width="4" height="3"/></svg>',
            caption: '', date: today, ts: Date.now(), duration: duration
          });
          done++;
          finish();
        });
      });
    } else {
      // 사진: blob → IndexedDB, 200px 썸네일만 localStorage
      compressImageForDB(file, function(blob, thumb) {
        saveImageBlob(id, blob).then(function() {
          photos.push({
            id: id, projId: currentProjId === 'all' ? 'etc' : currentProjId,
            type: 'image', thumb: thumb,
            caption: '', date: today, ts: Date.now()
          });
          done++;
          finish();
        });
      });
    }

    function finish() {
      if (done < arr.length) {
        showToast('처리 중... (' + done + '/' + arr.length + ')');
      } else {
        savePhotos(photos);
        renderPhotoView();
        showToast(arr.length + '개 업로드 완료');
      }
    }
  });
}

function generateVideoThumb(file, cb) {
  var url   = URL.createObjectURL(file);
  var video = document.createElement('video');
  video.muted = true;
  video.playsInline = true;
  video.preload = 'metadata';
  video.src = url;
  var done = false;
  function capture() {
    if (done) return;
    done = true;
    try {
      var w = Math.min(video.videoWidth  || 640, 640);
      var h = Math.min(video.videoHeight || 360, 360);
      if (video.videoWidth && video.videoHeight) {
        h = Math.round(video.videoHeight * w / video.videoWidth);
      }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(video, 0, 0, w, h);
      var thumb = canvas.toDataURL('image/jpeg', 0.7);
      URL.revokeObjectURL(url);
      cb(thumb, Math.round(video.duration || 0));
    } catch(e) {
      URL.revokeObjectURL(url);
      cb(null, 0);
    }
  }
  video.addEventListener('loadeddata', function() {
    video.currentTime = 0.5;
  });
  video.addEventListener('seeked', capture);
  video.addEventListener('error', function() { URL.revokeObjectURL(url); cb(null, 0); });
  // 모바일에서 seeked 안 올 경우 폴백
  setTimeout(function() { if (!done) capture(); }, 3000);
  video.load();
}

function compressImage(file, cb) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var MAX = 1200, w = img.width, h = img.height;
      if (w > MAX || h > MAX) {
        if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
        else       { w = Math.round(w * MAX / h); h = MAX; }
      }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', 0.78));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* IDB용: blob(원본) + 200px 썸네일(base64) 반환 */
function compressImageForDB(file, cb) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      // 원본 압축 (blob → IDB)
      var MAX = 1200, w = img.width, h = img.height;
      if (w > MAX || h > MAX) {
        if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
        else       { w = Math.round(w * MAX / h); h = MAX; }
      }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob(function(blob) {
        // 썸네일 (200px → localStorage)
        var TM = 200, tw = img.width, th = img.height;
        if (tw > th) { th = Math.round(th * TM / tw); tw = TM; }
        else         { tw = Math.round(tw * TM / th); th = TM; }
        var tc = document.createElement('canvas');
        tc.width = tw; tc.height = th;
        tc.getContext('2d').drawImage(img, 0, 0, tw, th);
        cb(blob, tc.toDataURL('image/jpeg', 0.75));
      }, 'image/jpeg', 0.82);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* base64 → 200px 썸네일 (마이그레이션용) */
function makeSmallThumb(base64, cb) {
  var img = new Image();
  img.onload = function() {
    var TM = 200, tw = img.width, th = img.height;
    if (tw > th) { th = Math.round(th * TM / tw); tw = TM; }
    else         { tw = Math.round(tw * TM / th); th = TM; }
    var tc = document.createElement('canvas');
    tc.width = tw; tc.height = th;
    tc.getContext('2d').drawImage(img, 0, 0, tw, th);
    cb(tc.toDataURL('image/jpeg', 0.75));
  };
  img.onerror = function() { cb(base64); }; // 실패 시 원본 유지
  img.src = base64;
}

/* ══ 삭제 ══ */
function deleteItem(id) {
  var items = loadPhotos();
  var target = items.find(function(p){ return p.id === id; });
  dahamConfirm('이 사진·영상을 삭제할까요?', function() {
    if (target) {
      if (target.type === 'video') deleteVideoBlob(id);
      else deleteImageBlob(id);
    }
    savePhotos(items.filter(function(p){ return p.id !== id; }));
    renderPhotoView();
    showToast('삭제됐습니다');
  });
}
function deleteCurrentPhoto() {
  var item = lightboxPhotos[lightboxIdx];
  if (!item) return;
  dahamConfirm('이 사진·영상을 삭제할까요?', function() {
    if (item.type === 'video') {
      stopLightboxVideo();
      deleteVideoBlob(item.id);
    } else {
      deleteImageBlob(item.id);
    }
    savePhotos(loadPhotos().filter(function(p){ return p.id !== item.id; }));
    lightboxPhotos.splice(lightboxIdx, 1);
    if (!lightboxPhotos.length) { closeLightbox(); renderPhotoView(); return; }
    if (lightboxIdx >= lightboxPhotos.length) lightboxIdx--;
    renderLightbox();
    renderPhotoView();
  });
}

/* ══ 라이트박스 ══ */
function openLightbox(idx) {
  lightboxIdx = idx;
  renderLightbox();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  stopLightboxVideo();
  stopLightboxImage();
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
  document.getElementById('caption-edit-wrap').classList.remove('open');
}
function stopLightboxVideo() {
  var v = document.getElementById('lightbox-video');
  v.pause(); v.src = '';
  if (_currentVideoUrl) { URL.revokeObjectURL(_currentVideoUrl); _currentVideoUrl = null; }
}
function stopLightboxImage() {
  if (_currentImageUrl) { URL.revokeObjectURL(_currentImageUrl); _currentImageUrl = null; }
}

function renderLightbox() {
  var item = lightboxPhotos[lightboxIdx];
  if (!item) return;
  var imgEl   = document.getElementById('lightbox-img');
  var videoEl = document.getElementById('lightbox-video');
  document.getElementById('lightbox-caption').textContent = item.caption || '';
  document.getElementById('lightbox-date').textContent    = item.date    || '';
  document.getElementById('caption-input').value          = item.caption || '';

  if (item.type === 'video') {
    imgEl.style.display   = 'none';
    videoEl.style.display = 'block';
    videoEl.src = '';
    openVideoDB().then(function() { return loadVideoBlob(item.id); }).then(function(blob) {
      if (!blob) { showToast('영상을 불러올 수 없습니다'); return; }
      stopLightboxVideo();
      _currentVideoUrl = URL.createObjectURL(blob);
      videoEl.src = _currentVideoUrl;
      videoEl.load();
    });
  } else {
    stopLightboxVideo();
    stopLightboxImage();
    videoEl.style.display = 'none';
    imgEl.style.display   = 'block';
    imgEl.src = item.thumb || ''; // 썸네일 먼저 표시
    loadImageBlob(item.id).then(function(blob) {
      if (blob) {
        _currentImageUrl = URL.createObjectURL(blob);
        imgEl.src = _currentImageUrl;
      } else if (item.url) {
        imgEl.src = item.url; // 구형 데이터 fallback
      }
    });
  }
}

function lightboxNav(dir) {
  stopLightboxVideo();
  lightboxIdx = (lightboxIdx + dir + lightboxPhotos.length) % lightboxPhotos.length;
  renderLightbox();
  document.getElementById('caption-edit-wrap').classList.remove('open');
}

// 스와이프
var _swipeX = 0;
document.getElementById('lightbox').addEventListener('touchstart', function(e){ _swipeX = e.touches[0].clientX; }, {passive:true});
document.getElementById('lightbox').addEventListener('touchend',   function(e){
  var dx = e.changedTouches[0].clientX - _swipeX;
  if (Math.abs(dx) > 50) lightboxNav(dx < 0 ? 1 : -1);
});
document.addEventListener('keydown', function(e){
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape')      closeLightbox();
  if (e.key === 'ArrowRight')  lightboxNav(1);
  if (e.key === 'ArrowLeft')   lightboxNav(-1);
});

/* ══ 다운로드 ══ */
function downloadCurrent() {
  var item = lightboxPhotos[lightboxIdx];
  if (!item) return;
  var filename = 'daham_' + item.date + '_' + item.id.slice(-4);

  if (item.type === 'video') {
    showToast('영상 준비 중...');
    openVideoDB().then(function() { return loadVideoBlob(item.id); }).then(function(blob) {
      if (!blob) { showToast('영상을 불러올 수 없습니다'); return; }
      var ext = blob.type.includes('mp4') ? 'mp4' : blob.type.includes('mov') ? 'mov' : 'mp4';
      saveFileAs(blob, filename + '.' + ext, blob.type || 'video/mp4');
    });
  } else {
    loadImageBlob(item.id).then(function(blob) {
      if (blob) {
        saveFileAs(blob, filename + '.jpg', 'image/jpeg');
      } else {
        // 구형 데이터 fallback
        fetch(item.url || item.thumb)
          .then(function(r){ return r.blob(); })
          .then(function(b){ saveFileAs(b, filename + '.jpg', 'image/jpeg'); });
      }
    });
  }
}

function saveFileAs(blob, suggestedName, mimeType) {
  // Chrome/Edge: 저장 위치 선택 창
  if (window.showSaveFilePicker) {
    var ext  = suggestedName.split('.').pop();
    var desc = mimeType.startsWith('video') ? '영상 파일' : '이미지 파일';
    window.showSaveFilePicker({
      suggestedName: suggestedName,
      types: [{ description: desc, accept: { [mimeType]: ['.' + ext] } }]
    }).then(function(fileHandle) {
      return fileHandle.createWritable();
    }).then(function(writable) {
      return writable.write(blob).then(function(){ return writable.close(); });
    }).then(function() {
      showToast('저장 완료');
    }).catch(function(e) {
      if (e.name !== 'AbortError') fallbackDownload(blob, suggestedName);
    });
  } else {
    // 미지원 브라우저: 기본 다운로드
    fallbackDownload(blob, suggestedName);
  }
}

function fallbackDownload(blob, filename) {
  var url = URL.createObjectURL(blob);
  var a   = document.createElement('a');
  a.href  = url;
  a.download = filename;
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
  showToast('Downloads 폴더에 저장됩니다');
}

/* ══ 캡션 수정 ══ */
function toggleCaptionEdit() {
  var wrap = document.getElementById('caption-edit-wrap');
  wrap.classList.toggle('open');
  if (wrap.classList.contains('open')) document.getElementById('caption-input').focus();
}
function saveCaption() {
  var item = lightboxPhotos[lightboxIdx];
  if (!item) return;
  var cap   = document.getElementById('caption-input').value.trim();
  var items = loadPhotos();
  var t = items.find(function(p){ return p.id === item.id; });
  if (t) { t.caption = cap; savePhotos(items); }
  item.caption = cap;
  document.getElementById('lightbox-caption').textContent = cap;
  document.getElementById('caption-edit-wrap').classList.remove('open');
  renderPhotoView();
  showToast('저장됐습니다');
}

/* ══ 유틸 ══ */
function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
}
function pad(n) { return n < 10 ? '0'+n : String(n); }
function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function fmtDuration(sec) {
  var total = Math.floor(sec);
  var m = Math.floor(total / 60), s = total % 60;
  return m + ':' + pad(s);
}

var _toastTimer;
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2500);
}

/* ══ 기존 사진 데이터 IDB 마이그레이션 ══ */
function migratePhotosToIDB() {
  var photos = loadPhotos();
  var toMigrate = photos.filter(function(p){ return p.type === 'image' && p.url; });
  if (!toMigrate.length) return;

  var done = 0;
  var total = toMigrate.length;

  toMigrate.forEach(function(ph) {
    var base64 = ph.url;
    fetch(base64)
      .then(function(r){ return r.blob(); })
      .then(function(blob){ return saveImageBlob(ph.id, blob); })
      .then(function(){
        makeSmallThumb(base64, function(thumb){
          ph.thumb = thumb;
          ph.url   = null;
          done++;
          if (done === total) {
            savePhotos(photos);
            renderPhotoView(); // 썸네일 새로고침
          }
        });
      })
      .catch(function(){
        ph.url = null; // 실패해도 url 제거
        done++;
        if (done === total) savePhotos(photos);
      });
  });
}

/* ══ 초기화 ══ */
openPhotoDB().then(function(){ migratePhotosToIDB(); });
showAlbumView();
