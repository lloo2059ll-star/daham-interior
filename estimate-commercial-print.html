<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAHAM — 상가 견적서</title><script src="auth.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#eef1f6;color:#172036;font:13px Pretendard,-apple-system,sans-serif}.toolbar{position:sticky;top:0;padding:10px 20px;background:#fff;border-bottom:2px solid #6238df;display:flex;justify-content:space-between}.btn{border:1px solid #ddd;background:#fff;border-radius:7px;padding:8px 13px;font-weight:700;cursor:pointer}.page{width:210mm;min-height:297mm;margin:18px auto;background:#fff;padding:18mm 16mm;box-shadow:0 4px 20px #1f2b4420;border-top:6px solid #6238df}.head{display:flex;justify-content:space-between;border-bottom:1px solid #e3e7ef;padding-bottom:18px}.brand{font-size:27px;font-weight:900;letter-spacing:.12em}.type{color:#6238df;font-weight:800}.title{text-align:center;margin:28px}.title h1{font-size:27px;letter-spacing:.12em}.info{display:grid;grid-template-columns:1fr 1fr;border:1px solid #e4e7ee;margin-bottom:25px}.cell{padding:12px 15px;border-bottom:1px solid #e4e7ee}.cell:nth-child(odd){border-right:1px solid #e4e7ee}.label{font-size:10px;color:#8a93a5;margin-bottom:5px}.value{font-weight:800}.rows{border-top:2px solid #172036}.row{display:grid;grid-template-columns:45px 1fr 150px;padding:11px;border-bottom:1px solid #e9ecf2}.row span:last-child{text-align:right;font-weight:800}.totals{margin-top:24px;border:2px solid #172036;padding:18px}.total{display:flex;justify-content:space-between;padding:5px}.grand{font-size:23px;color:#6238df;border-top:1px solid #ddd;margin-top:8px;padding-top:14px;font-weight:900}.foot{margin-top:30px;padding-top:14px;border-top:1px solid #ddd;color:#7c8496}@media print{@page{size:A4;margin:0}body{background:#fff}.toolbar{display:none}.page{margin:0;box-shadow:none}}</style></head><body><div class="toolbar"><strong>DAHAM · 상가 견적서</strong><div><button class="btn" onclick="history.back()">← 돌아가기</button> <button class="btn" onclick="window.print()">인쇄 / PDF</button></div></div><div id="doc"></div><script>
const labels={'temporary':'가설·보양','demolition':'철거·폐기물','plumbing':'설비','electrical':'전기·조명','hvac':'냉난방·환기','metal-glass':'금속·유리','carpentry':'목공','tile':'타일','paint':'도장','film':'필름','wallpaper':'도배','flooring':'바닥','door':'문·도어','fire':'소방','cleaning':'청소','site-cost':'기타·현장경비'},won=n=>Math.round(Number(n)||0).toLocaleString('ko-KR')+' 원',esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function renderCommercialPrint(d){const rows=Object.entries(d.customerCategoryTotals||{}).filter(x=>Number(x[1])>0).map((x,i)=>`<div class="row"><span>${String(i+1).padStart(2,'0')}</span><strong>${labels[x[0]]||esc(x[0])}</strong><span>${won(x[1])}</span></div>`).join('');document.getElementById('doc').innerHTML=`<main class="page"><div class="head"><div class="brand">DAHAM</div><div class="type">COMMERCIAL ESTIMATE</div></div><div class="title"><h1>상가 공사 견적서</h1></div><section class="info"><div class="cell"><div class="label">현장명</div><div class="value">${esc(d.client?.siteName||'-')}</div></div><div class="cell"><div class="label">고객명</div><div class="value">${esc(d.client?.clientName||'-')}</div></div><div class="cell"><div class="label">공사면적</div><div class="value">${d.areaPyeong||0}평</div></div><div class="cell"><div class="label">견적 구분</div><div class="value">상가 인테리어</div></div></section><section class="rows">${rows}</section><section class="totals"><div class="total"><span>부가세</span><strong>${won(d.vat)}</strong></div><div class="total grand"><span>최종 견적금액</span><strong>${won(d.grandTotal)}</strong></div></section><footer class="foot">본 견적서는 선택된 공사 범위를 기준으로 작성되었으며 인건비·자재비·이윤 등 내부 원가는 표시하지 않습니다.</footer></main>`}
let data=null;try{data=JSON.parse(localStorage.getItem('daham_estimate_print')||'null')}catch(e){}if(!data||data.estimateType !== 'commercial')document.getElementById('doc').innerHTML='<main class="page">상가 견적 데이터를 불러올 수 없습니다.</main>';else renderCommercialPrint(data);
</script></body></html>
