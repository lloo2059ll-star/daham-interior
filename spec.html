<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DAHAM — 공사 시방서</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="auth.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --orange:#E65100;--orange-dk:#BF360C;--orange-lt:#FFF3EE;
  --ink:#1a1a1a;--mid:#555;--dim:#aaa;--line:#e0e0e0;--line-lt:#f5f5f5;
  --bg:#f2f2f2;--white:#fff;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:13px}

/* ── TOOLBAR ── */
.toolbar{position:sticky;top:0;z-index:100;height:48px;padding:0 24px;
  display:flex;align-items:center;justify-content:space-between;
  background:#fff;border-bottom:2px solid var(--orange);
  box-shadow:0 2px 8px rgba(0,0,0,.06)}
.brand{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.14em;color:var(--orange)}
.tb-btn{font-family:var(--sans);font-size:11px;font-weight:500;padding:6px 14px;cursor:pointer;
  border:1.5px solid var(--line);background:#fff;color:var(--mid);transition:all .15s;text-decoration:none;display:inline-flex;align-items:center}
.tb-btn:hover{border-color:var(--ink);color:var(--ink)}
.tb-btn.primary{border-color:var(--orange);background:var(--orange);color:#fff}
.tb-btn.primary:hover{background:var(--orange-dk)}

/* ── EDITOR ── */
.editor{max-width:820px;margin:32px auto 80px;padding:0 20px}
.editor-title{font-size:18px;font-weight:700;margin-bottom:4px}
.editor-sub{font-size:11px;color:var(--dim);margin-bottom:24px}

.form-sec{background:#fff;border:1px solid var(--line);margin-bottom:14px}
.form-sec-hd{padding:11px 16px;border-bottom:1px solid var(--line);
  font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.form-row{display:flex;flex-direction:column;padding:12px 16px;border-bottom:1px solid var(--line-lt)}
.form-row:last-child{border-bottom:none}
.form-row.wide{grid-column:span 2}
.form-row label{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--dim);margin-bottom:5px}
.form-row input,.form-row textarea,.form-row select{
  font-family:var(--sans);font-size:13px;color:var(--ink);
  border:none;border-bottom:1px solid var(--line);outline:none;
  padding:4px 0;background:transparent;width:100%;transition:border-color .15s}
.form-row input:focus,.form-row textarea:focus{border-color:var(--orange)}
.form-row textarea{resize:vertical;min-height:60px;line-height:1.7}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:8px 20px;font-size:11px;
  opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}

/* ── PREVIEW ── */
.preview-wrap{max-width:820px;margin:0 auto 80px;padding:0 20px;display:none}
.preview-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}

/* ── DOCUMENT ── */
.doc{background:#fff;border:1px solid var(--line);padding:52px 56px;
  font-size:12px;line-height:1.8;box-shadow:0 4px 24px rgba(0,0,0,.07)}

.doc-header{border-bottom:3px solid var(--orange);padding-bottom:20px;margin-bottom:32px;
  display:flex;align-items:flex-end;justify-content:space-between}
.doc-brand{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:.14em;color:var(--orange)}
.doc-brand-sub{font-size:12px;color:var(--mid);letter-spacing:.06em;margin-top:3px}
.doc-title-block{text-align:right}
.doc-title{font-size:34px;font-weight:900;letter-spacing:.06em;color:var(--ink)}
.doc-title-sub{font-size:11px;color:var(--mid);letter-spacing:.1em;margin-top:4px}
.doc-no{font-size:11px;color:var(--dim);margin-top:2px}

.sec-title{font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--ink);
  padding:8px 0 8px 14px;border-left:4px solid var(--orange);margin:28px 0 12px}

/* 개요 테이블 */
.info-tbl{width:100%;border-collapse:collapse;margin-bottom:0}
.info-tbl th{width:26%;padding:10px 14px;background:#4B5563;color:#fff;
  font-size:13px;font-weight:700;border:1px solid #4B5563;text-align:left}
.info-tbl td{padding:10px 14px;border:1px solid var(--line);font-size:13px;font-weight:500}
.info-tbl tr:nth-child(even) td{background:#fafafa}

/* 공종 테이블 */
.spec-tbl{width:100%;border-collapse:collapse;margin-bottom:0}
.spec-tbl thead th{background:var(--orange);color:#fff;padding:10px 12px;
  font-size:12px;font-weight:700;letter-spacing:.04em;border:1px solid var(--orange-dk);text-align:left}
.spec-tbl tbody tr:nth-child(even) td{background:#fafafa}
.spec-tbl td{padding:9px 12px;border:1px solid var(--line);font-size:12px;vertical-align:top;line-height:1.7}
.spec-tbl td.phase{font-weight:700;white-space:nowrap;color:var(--ink)}
.spec-tbl td.mat{color:var(--mid)}
.spec-tbl td.period{white-space:nowrap;color:var(--ink);font-weight:600}
.mat-item{font-size:11px;color:var(--mid);display:block;line-height:1.6}
.mat-item strong{color:var(--ink);font-weight:600}

/* 보증 섹션 */
.warranty-tbl{width:100%;border-collapse:collapse}
.warranty-tbl th{background:#374151;color:#fff;padding:9px 14px;
  font-size:12px;font-weight:700;border:1px solid #374151;text-align:left}
.warranty-tbl td{padding:9px 14px;border:1px solid var(--line);font-size:12px}
.warranty-tbl tr:nth-child(even) td{background:#fafafa}

/* 특기사항 */
.special-box{background:#fafafa;border:1px solid var(--line);padding:16px 18px;
  font-size:13px;line-height:2;white-space:pre-wrap;min-height:60px}

/* 확인란 */
.confirm-wrap{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:4px}
.confirm-box{border:1px solid var(--line);padding:20px 24px}
.confirm-box-title{font-size:11px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--dim);margin-bottom:16px;
  padding-bottom:8px;border-bottom:1px solid var(--line-lt)}
.confirm-row{display:flex;justify-content:space-between;align-items:flex-end;
  padding:10px 0;border-bottom:1px solid var(--line-lt);font-size:13px}
.confirm-row:last-child{border-bottom:none}
.confirm-lbl{font-weight:600;color:var(--ink)}
.confirm-val{color:var(--mid);font-size:12px}
.sign-line{margin-top:20px;border-top:1px solid var(--ink);padding-top:6px;
  text-align:center;font-size:11px;color:var(--dim);letter-spacing:.06em}

.doc-footer{margin-top:28px;display:flex;justify-content:space-between;align-items:flex-end;
  border-top:1px solid var(--line);padding-top:20px}
.qr-group{display:flex;gap:32px}
.qr-item{display:flex;flex-direction:column;align-items:center;gap:6px}
.qr-item img{width:90px;height:90px;object-fit:contain}
.qr-lbl{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--mid)}
.sig-block{text-align:right;line-height:2}
.sig-company{font-size:15px;font-weight:800}
.sig-detail{font-size:12px;color:var(--mid)}
.sig-stamp{display:inline-block;margin-top:8px;padding:6px 18px;
  border:2px solid var(--orange);color:var(--orange);font-size:13px;font-weight:700;letter-spacing:.08em}

/* ── PHASE MAT EDITOR ── */
.phase-mat-row{display:flex;align-items:flex-start;border-bottom:1px solid var(--line-lt);padding:10px 16px;gap:16px}
.phase-mat-row:last-child{border-bottom:none}
.phase-mat-lbl{font-size:12px;font-weight:700;min-width:110px;padding-top:6px;color:var(--ink)}
.phase-mat-row textarea{flex:1;font-family:var(--sans);font-size:12px;border:1px solid var(--line);
  padding:6px 8px;outline:none;resize:vertical;min-height:34px;line-height:1.7;background:#fff;color:var(--ink)}
.phase-mat-row textarea:focus{border-color:var(--orange)}
.phase-mat-hint{font-size:10px;color:var(--dim);padding:6px 16px 10px;line-height:1.7}

/* ── PRINT ── */
@media print{
  @page{size:A4 portrait;margin:15mm 16mm}
  .toolbar,.editor,.tb-actions,.preview-topbar,.toast,#saved-list-wrap{display:none!important}
  .preview-wrap{display:block!important;max-width:100%;margin:0;padding:0}
  body{background:#fff;font-size:11px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .doc{border:none;box-shadow:none;padding:0;line-height:1.7}
  .doc-header{padding-bottom:10px;margin-bottom:16px;page-break-inside:avoid}
  .doc-brand{font-size:22px}.doc-title{font-size:24px}
  .sec-title{margin:14px 0 7px;font-size:11px;page-break-after:avoid}
  .info-tbl th,.info-tbl td{padding:7px 10px;font-size:11px}
  .spec-tbl th,.spec-tbl td{padding:6px 8px;font-size:10.5px}
  .warranty-tbl th,.warranty-tbl td{padding:6px 10px;font-size:11px}
  .mat-item{font-size:10px}
  table{page-break-inside:auto}
  tr{page-break-inside:avoid;page-break-after:auto}
  thead{display:table-header-group}
  .special-box{page-break-inside:avoid;font-size:11px}
  .confirm-wrap{page-break-inside:avoid;margin-top:10px}
  .confirm-row{font-size:11px;padding:7px 0}
  .doc-footer{margin-top:14px;padding-top:10px;page-break-inside:avoid}
  .qr-item img{width:70px;height:70px}
  .sig-company{font-size:13px}
  .sig-detail{font-size:11px}
}
</style>
<link rel="stylesheet" href="v2-theme.css">
<link rel="stylesheet" href="v2-suite.css">
<script defer src="v2-suite.js"></script>
<link rel="stylesheet" href="operations-ui.css">
</head>
<body class="operations-ui operations-document">

<div class="toolbar">
  <div style="display:flex;align-items:center;gap:12px">
    <a href="index.html" class="tb-btn">← 홈</a>
    <span class="brand">DAHAM</span>
  </div>
  <div style="display:flex;gap:6px;align-items:center">
    <button class="tb-btn" onclick="saveSpec()">저장</button>
    <button class="tb-btn" onclick="showPreview()">미리보기</button>
    <button class="tb-btn primary" onclick="printDoc()">인쇄 / PDF</button>
  </div>
</div>

<!-- 저장된 시방서 목록 -->
<div id="saved-list-wrap" style="max-width:820px;margin:24px auto 0;padding:0 20px;display:none">
  <div style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--dim);margin-bottom:12px;display:flex;align-items:center;gap:10px">
    저장된 시방서<span style="flex:1;height:1px;background:var(--line);display:block"></span>
  </div>
  <div id="saved-list" style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px"></div>
</div>

<!-- EDITOR -->
<div class="editor" id="editor">
  <div class="editor-title">공사 시방서</div>
  <div class="editor-sub">견적서·일정표와 연동하여 고객 제출용 시방서를 자동 작성합니다.</div>

  <!-- 현장 선택 -->
  <div class="form-sec" style="border-left:3px solid var(--orange)">
    <div class="form-sec-hd">일정표에서 현장 불러오기</div>
    <div class="form-row wide" style="border:none;flex-direction:row;align-items:center;gap:12px">
      <select id="sched-sel" onchange="loadFromSchedule()"
        style="font-family:var(--sans);font-size:13px;border:1.5px solid var(--line);
               padding:7px 10px;background:#fff;color:var(--ink);flex:1;outline:none;cursor:pointer">
        <option value="">-- 현장 선택 --</option>
      </select>
      <span style="font-size:11px;color:var(--dim);white-space:nowrap">현장 선택 시 자재·일정 자동 입력</span>
    </div>
  </div>

  <!-- 공종별 자재 입력 -->
  <div class="form-sec" id="phase-mat-sec" style="display:none">
    <div class="form-sec-hd">공종별 자재 입력 <span style="font-weight:400;color:var(--dim);text-transform:none;letter-spacing:0;font-size:10px">— 한 줄에 하나씩 입력 (현장 협의 항목은 비워두세요)</span></div>
    <div id="phase-mat-rows"></div>
  </div>

  <!-- 공사 개요 -->
  <div class="form-sec">
    <div class="form-sec-hd">공사 개요</div>
    <div class="form-grid">
      <div class="form-row wide">
        <label>공사 현장 주소</label>
        <input type="text" id="f-addr" placeholder="예) 경남 거창군 거창읍 푸르지오 104동 1103호">
      </div>
      <div class="form-row">
        <label>착공일</label>
        <input type="date" id="f-start">
      </div>
      <div class="form-row">
        <label>준공 예정일</label>
        <input type="date" id="f-end">
      </div>
      <div class="form-row">
        <label>고객명</label>
        <input type="text" id="f-client" placeholder="홍길동">
      </div>
      <div class="form-row">
        <label>연락처</label>
        <input type="text" id="f-tel" placeholder="010-0000-0000">
      </div>
    </div>
  </div>

  <!-- 특기 사항 -->
  <div class="form-sec">
    <div class="form-sec-hd">특기 사항 (선택)</div>
    <div class="form-row wide" style="border:none">
      <label>공사 범위 외 항목 또는 고객 요청 사항</label>
      <textarea id="f-special" placeholder="예) 기존 붙박이장 재사용, 발코니 확장 미포함 등"></textarea>
    </div>
  </div>
</div>

<!-- PREVIEW -->
<div class="preview-wrap" id="preview-wrap">
  <div class="preview-topbar">
    <div style="font-size:12px;color:var(--mid)">미리보기 — 실제 인쇄 결과와 유사합니다</div>
    <button class="tb-btn" onclick="showEditor()">← 편집으로</button>
  </div>
  <div class="doc" id="doc"></div>
</div>

<div class="toast" id="toast"></div>

<script>
var SCHED_KEY = 'daham_schedule_v1';
var EST_KEY   = 'daham_detail_v2';
var SPEC_KEY  = 'daham_spec_v1';
var SPEC_TS_KEY = 'daham_spec_v1_ts';

/* ── Supabase 클라우드 동기화 ── */
var _AUTH_CONFIG = DAHAM_AUTH.getSupabaseConfig();
var SUPA_URL = _AUTH_CONFIG.url;
var SUPA_KEY = _AUTH_CONFIG.key;
var _sb = null;
function initCloud(){
  try{
    var token = window.DAHAM_AUTH && DAHAM_AUTH.getAccessToken ? DAHAM_AUTH.getAccessToken() : '';
    _sb = window.supabase.createClient(SUPA_URL, SUPA_KEY,{
      global:{headers: token ? {Authorization:'Bearer '+token} : {}},
      auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}
    });
  }catch(e){ _sb=null; }
}
function cloudPushSpec(){
  if(!_sb) return;
  var ts = new Date().toISOString();
  var val = localStorage.getItem(SPEC_KEY)||'[]';
  localStorage.setItem(SPEC_TS_KEY, ts);
  _sb.from('sync_data').upsert({key:SPEC_KEY, value:val, updated_at:ts}).then(function(){});
}
function cloudPullSpec(cb){
  if(!_sb){ if(cb) cb(); return; }
  _sb.from('sync_data').select('value,updated_at').eq('key',SPEC_KEY).maybeSingle()
    .then(function(r){
      if(r.data && r.data.value){
        var localTs = localStorage.getItem(SPEC_TS_KEY)||'';
        if(r.data.updated_at > localTs){
          try{
            localStorage.setItem(SPEC_KEY, r.data.value);
            localStorage.setItem(SPEC_TS_KEY, r.data.updated_at);
            savedSpecs = JSON.parse(r.data.value);
          }catch(e){}
        }
      }
      if(cb) cb();
    });
}
var DOW_KO    = ['일','월','화','수','목','금','토'];
var MONTH_KO  = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

/* 공종 → 견적 섹션 매핑 */
var PHASE_TO_SEC = {
  '철거':['철거'],'마루철거':['철거'],
  '설비 (배관)':['설비'],'위생도기':['설비'],
  '전기':['전기/조명'],'조명':['전기/조명'],
  '에어컨 타공':['시스템에어컨'],'에어컨 마감':['시스템에어컨'],
  '창호':['샷시'],
  '목공':['목작업','문/문틀','인테리어철물'],'중문':['중문'],
  '필름·유리':['필름'],
  '타일':['거실욕실','안방욕실','타일류'],'욕실천장':['거실욕실','안방욕실'],
  '도장':['탄성코트'],
  '도배':['도배'],
  '바닥재':['바닥'],'마루':['바닥'],'장판':['바닥'],
  '주방·붙박이장':['싱크대','가구'],
  '입주청소':['기타 및 요청사항']
};

/* 병합 그룹 — 에디터·문서에서 한 칸으로 표시 */
var MERGE_GROUPS = [
  {names:['철거','마루철거'],           label:'철거',                    id:'mg-demolish'},
  {names:['타일','욕실천장','위생도기'], label:'타일·욕실천장·위생도기', id:'mg-tile'},
  {names:['전기','조명'],               label:'전기·조명',               id:'mg-elec'}
];
function getGroupForTask(name){
  for(var i=0;i<MERGE_GROUPS.length;i++){
    if(MERGE_GROUPS[i].names.indexOf(name)>=0) return MERGE_GROUPS[i];
  }
  return null;
}

/* 하자 보증 기간 */
var WARRANTY = [
  {phase:'도배·도장',         period:'1년'},
  {phase:'바닥재 (마루/장판)', period:'1년'},
  {phase:'타일·욕실천장·위생도기', period:'1년'},
  {phase:'전기·조명',              period:'1년'},
  {phase:'설비 (배관)',            period:'1년'},
  {phase:'목공·가구',         period:'1년'},
  {phase:'창호',              period:'제작창 1년 · 완성창 제조사 보증'},
  {phase:'중문',              period:'1년'},
  {phase:'에어컨 설치',       period:'제조사 문의'}
];

var schedProjects = [];
var estProjects   = [];
var savedSpecs    = [];
var currentSched  = null;
var currentEst    = null;

function loadProjects(){
  try{ schedProjects = JSON.parse(localStorage.getItem(SCHED_KEY)||'[]'); }catch(e){ schedProjects=[]; }
  try{ estProjects   = JSON.parse(localStorage.getItem(EST_KEY)||'[]');   }catch(e){ estProjects=[]; }
  try{ savedSpecs    = JSON.parse(localStorage.getItem(SPEC_KEY)||'[]');  }catch(e){ savedSpecs=[]; }
}
function saveAllSpecs(){
  localStorage.setItem(SPEC_KEY, JSON.stringify(savedSpecs));
  cloudPushSpec();
}

function renderSavedList(){
  var wrap = document.getElementById('saved-list-wrap');
  var list = document.getElementById('saved-list');
  if(!savedSpecs.length){ wrap.style.display='none'; return; }
  wrap.style.display='block';
  var sorted = savedSpecs.slice().sort(function(a,b){ return (b.savedAt||'')>(a.savedAt||'')?1:-1; });
  list.innerHTML = sorted.map(function(s){
    var d=new Date(s.savedAt||0);
    var ds=d.getFullYear()+'.'+(d.getMonth()+1)+'.'+d.getDate();
    return '<div style="background:#fff;border:1.5px solid var(--line);border-radius:8px;'
      +'padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:20px;min-width:220px">'
      +'<div>'
        +'<div style="font-size:13px;font-weight:700;color:var(--ink)">'+esc(s.projName)+'</div>'
        +'<div style="font-size:10px;color:var(--dim);margin-top:2px">저장: '+ds+'</div>'
      +'</div>'

function saveSpec(){
  if(!currentSched){ showToast('현장을 먼저 선택해주세요'); return; }
  var mats={};
  document.querySelectorAll('#phase-mat-rows textarea').forEach(function(ta){ mats[ta.id]=ta.value; });
  var spec={
    schedId:  currentSched.id,
    projName: (currentSched.info&&(currentSched.info.name||currentSched.info.addr))||'현장명 미입력',
    addr:     document.getElementById('f-addr').value,
    start:    document.getElementById('f-start').value,
    end:      document.getElementById('f-end').value,
    client:   document.getElementById('f-client').value,
    tel:      document.getElementById('f-tel').value,
    special:  document.getElementById('f-special').value,
    materials:mats,
    savedAt:  new Date().toISOString()
  };
  var idx=savedSpecs.findIndex(function(s){ return s.schedId===currentSched.id; });
  if(idx>=0) savedSpecs[idx]=spec; else savedSpecs.push(spec);
  saveAllSpecs();
  renderSavedList();
  showToast('✓ 저장했습니다');
}

function viewSavedSpec(schedId){
  var s=savedSpecs.find(function(x){ return x.schedId===schedId; });

  buildDoc(s);
  document.getElementById('editor').style.display='none';
  document.getElementById('saved-list-wrap').style.display='none';
  document.getElementById('preview-wrap').style.display='block';

}

function deleteSavedSpec(schedId){
  dahamConfirm('저장된 시방서를 삭제하시겠습니까?', function(){
    savedSpecs=savedSpecs.filter(function(s){ return s.schedId!==schedId; });

    showToast('삭제했습니다');

function applySavedMaterials(schedId){
  var s=savedSpecs.find(function(x){ return x.schedId===schedId; });

  Object.keys(s.materials).forEach(function(tid){

function loadFromSchedule(){
  var id = document.getElementById('sched-sel').value;
  if(!id){ currentSched=null; currentEst=null; return; }
  currentSched = null; currentEst = null;
  schedProjects.forEach(function(p){ if(p.id===id) currentSched=p; });
  if(!currentSched) return;
  if(currentSched.estimateId){
    estProjects.forEach(function(p){ if(p.id===currentSched.estimateId) currentEst=p; });
  }
  var info = currentSched.info||{};
  document.getElementById('f-addr').value  = info.addr||info.name||'';
  document.getElementById('f-start').value = info.start||'';
  document.getElementById('f-end').value   = info.end||'';

  document.getElementById('f-tel').value   = info.tel||'';
  renderPhaseMaterialsEditor();

function renderPhaseMaterialsEditor(){
  var sec  = document.getElementById('phase-mat-sec');
  var rows = document.getElementById('phase-mat-rows');
  if(!currentSched){ sec.style.display='none'; return; }
  var tasks = (currentSched.tasks||[]).filter(function(t){
    return t.name!=='에어컨 타공' && t.name!=='에어컨 마감';
  });
  if(!tasks.length){ sec.style.display='none'; return; }
  sec.style.display='block';

  var items=[], seenGroups={};
  tasks.forEach(function(t){
    var grp=getGroupForTask(t.name);
    if(grp){
      if(!seenGroups[grp.id]){ seenGroups[grp.id]={isGroup:true,grp:grp,taskNames:[]}; items.push(seenGroups[grp.id]); }
      seenGroups[grp.id].taskNames.push(t.name);
    } else {
      items.push({isGroup:false,task:t});
    }
  });

  var html='';
  items.forEach(function(item){
    if(item.isGroup){
      var pre=dedupLines(item.taskNames.map(formatMaterialsText).filter(Boolean).join('\n'));
      html+='<div class="phase-mat-row">'
        +'<div class="phase-mat-lbl">'+esc(item.grp.label)+'</div>'
        +'<textarea id="'+item.grp.id+'" rows="'+(pre?Math.min(pre.split('\n').length+1,6):2)+'" placeholder="자재명, 규격, 색상 등 (비워두면 현장 협의로 표시)">'+esc(pre)+'</textarea>'
        +'</div>';
    } else {
      var t=item.task;
      var pre=formatMaterialsText(t.name);
      html+='<div class="phase-mat-row">'
        +'<div class="phase-mat-lbl">'+esc(t.name)+'</div>'
        +'<textarea id="mat-'+t.id+'" rows="'+(pre?Math.min(pre.split('\n').length+1,6):2)+'" placeholder="자재명, 규격, 색상 등 (비워두면 현장 협의로 표시)">'+esc(pre)+'</textarea>'
        +'</div>';
    }
  });
  rows.innerHTML=html;
}

/* 날짜 포맷 */
function fmtD(ds){
  if(!ds) return '';
  var p=ds.split('-');
  return parseInt(p[1])+'월 '+parseInt(p[2])+'일';
}
function fmtDFull(ds){
  if(!ds) return '';
  var p=ds.split('-');
  return p[0]+'년 '+parseInt(p[1])+'월 '+parseInt(p[2])+'일';
}
function fmtPeriod(s,e){
  if(!s) return '-';
  if(!e||s===e) return fmtD(s);
  return fmtD(s)+' ~ '+fmtD(e);
}

/* 자재 조회 */
function getMaterials(taskName){
  if(!currentEst||!currentEst.selectedMaterials) return [];
  var secs = PHASE_TO_SEC[taskName]||[];
  if(!secs.length) return [];
  return currentEst.selectedMaterials.filter(function(m){
    return secs.indexOf(m.sec)>=0;
  });
}

var NO_QTY_TASKS = ['창호'];

function formatMaterialsText(taskName){
  var mats = getMaterials(taskName);
  if(!mats.length) return '';
  var showQty = NO_QTY_TASKS.indexOf(taskName) < 0;
  var seen={}, lines=[];
  mats.forEach(function(m){
    var k=(m.sub||'')+'|'+(m.det||'');
    if(!k||seen[k]) return;
    seen[k]=1;
    var line=m.sub;
    if(m.det) line+=' '+m.det;
    if(showQty&&m.qty){if(/^\d/.test(String(m.unit||'')))line+=' ('+m.qty+')';else line+=' ('+m.qty+m.unit+')';}

    lines.push(line);
  });
  return lines.join('\n');
}
function dedupLines(text){
  var seen={}, out=[];
  text.split('\n').forEach(function(l){
    var t=l.trim();
    if(t&&!seen[t]){ seen[t]=1; out.push(t); }
  });
  return out.join('\n');
}

function renderMaterialsFromInput(taskId, matData){
  var text;
  if(matData!=null){ text=(matData['mat-'+taskId]||'').trim(); }
  else{ var el=document.getElementById('mat-'+taskId); text=el?el.value.trim():''; }
  if(!text) return '<span style="color:var(--dim);font-size:11px">현장 협의</span>';
  return text.split('\n').filter(Boolean).map(function(l){
    return '<span class="mat-item">'+esc(l)+'</span>';
  }).join('');
}
function renderMaterialsFromGroupId(id, matData){
  var text;
  if(matData!=null){ text=(matData[id]||'').trim(); }
  else{ var el=document.getElementById(id); text=el?el.value.trim():''; }
  if(!text) return '<span style="color:var(--dim);font-size:11px">현장 협의</span>';
  return text.split('\n').filter(Boolean).map(function(l){
    return '<span class="mat-item">'+esc(l)+'</span>';
  }).join('');
}
